org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# media3 - and androidx.core, androidx.annotation and the rest of what it
# pulls in - lives under the androidx namespace, and AGP will not merge a
# classpath containing it unless this is on. It was off only because the
# original scaffold had no dependencies whatsoever.
android.useAndroidX=true

# Jetifier rewrites old com.android.support artifacts into androidx on the
# fly. Nothing in this project uses the support library, so leaving it off
# skips a transform over every dependency in the graph.
android.enableJetifier=false

android.nonTransitiveRClass=true
