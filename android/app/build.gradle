plugins {
	id 'com.android.application'
}

// The signing material never lives in this file, and never in the repository.
// CI decodes the keystore from a base64 file into a temporary path and passes
// it in through the environment; a local build with none of these set simply
// produces an unsigned release, which Gradle will still assemble.
def keystorePath  = System.getenv('BBG_KEYSTORE_FILE')
def keystorePwd   = System.getenv('BBG_KEYSTORE_PASSWORD')
def keystoreAlias = System.getenv('BBG_KEY_ALIAS')
def keyPwd        = System.getenv('BBG_KEY_PASSWORD')
def hasSigning    = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

// Worked out here rather than inline. In Groovy, `versionCode (expr).toInteger()`
// parses as a call to versionCode followed by a method on its return value,
// which is null - so keep the arithmetic out of the assignment entirely.
def buildNumber = Integer.parseInt(System.getenv('BBG_VERSION_CODE') ?: '1')
def buildName   = System.getenv('BBG_VERSION_NAME') ?: '1.0'

android {
	namespace 'com.kobolibra.bbglive'
	compileSdk 34

	defaultConfig {
		applicationId 'com.kobolibra.bbglive'
		minSdk 24
		targetSdk 34
		// The build number, so every published APK installs over the previous
		// one instead of being refused as a downgrade.
		versionCode buildNumber
		versionName buildName
	}

	signingConfigs {
		release {
			if (hasSigning) {
				storeFile file(keystorePath)
				storePassword keystorePwd
				keyAlias keystoreAlias
				keyPassword keyPwd
				// v1 as well as v2/v3, so the package installs cleanly on the
				// older API 24 devices this app still supports.
				enableV1Signing true
				enableV2Signing true
			}
		}
	}

	buildTypes {
		debug {
			minifyEnabled false
		}
		release {
			// The optimiser stays off. It would now have a library to chew on,
			// but the bridge class is reached only from JavaScript through
			// addJavascriptInterface - a call site no shrinker can see - so
			// enabling it would mean maintaining keep rules to protect code that
			// looks dead and is not. The saving is not worth that class of bug.
			minifyEnabled false
			shrinkResources false
			debuggable false
			if (hasSigning) {
				signingConfig signingConfigs.release
			}
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}

// media3 is the one thing the platform cannot supply.
//
// Android's own MediaPlayer speaks HLS, but badly: no variant list, no way to
// cap the ladder, no latency figure, and no control over the live window - all
// of which this app's controls are built on. ExoPlayer exposes every one of
// them, and it is what the set-top box applications that play this channel
// well are using.
//
// Two artifacts only. media3-ui is deliberately absent: its PlayerView brings a
// full control surface of its own, and the controls here are the web page's.
// The picture is drawn straight into a TextureView instead.
dependencies {
	implementation 'androidx.media3:media3-exoplayer:1.3.1'
	implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
}
