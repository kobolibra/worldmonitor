<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Live</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0e11; color:#e8eaed; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; background:#13171c; border-bottom:1px solid #222; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; font-weight:600; letter-spacing:.5px; }
  header h1 span { color:#fa6a00; }
  .channels { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .channels button { background:#1d232b; color:#cfd3d8; border:1px solid #2a323c; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; transition:.15s; }
  .channels button:hover { background:#262d36; }
  .channels button.active { background:#fa6a00; color:#0b0e11; border-color:#fa6a00; font-weight:600; }
  .player { flex:1; position:relative; background:#000; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  footer { padding:8px 20px; font-size:12px; color:#6b7178; background:#13171c; border-top:1px solid #222; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .custom input { background:#1d232b; border:1px solid #2a323c; color:#e8eaed; padding:5px 8px; border-radius:6px; font-size:13px; width:150px; }
  .custom button { background:#1d232b; border:1px solid #2a323c; color:#cfd3d8; padding:5px 10px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <h1><span>Bloomberg</span> Live</h1>
    <div class="channels" id="channels"></div>
  </header>
  <div class="player">
    <iframe id="player" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
  <footer>
    <span>源自 YouTube 官方直播 · 若提示「无直播」请切换频道或稍后再试</span>
    <span class="custom">手动视频ID: <input id="vid" placeholder="如 f39oHo6vFLg"><button onclick="playCustom()">播放</button></span>
  </footer>
<script>
  var CHANNELS = [
    { name: "Bloomberg 24/7", type: "video",   id: "f39oHo6vFLg" },
    { name: "Bloomberg TV",   type: "channel", id: "UCIALMKvObZNtJ6AmdCLP7Lg" },
    { name: "Bloomberg Tech", type: "video",   id: "CAy6O15RDv8" }
  ];
  var player = document.getElementById("player");
  var channelsEl = document.getElementById("channels");
  function srcFor(ch) {
    if (ch.type === "channel")
      return "https://www.youtube.com/embed/live_stream?channel=" + ch.id + "&autoplay=1";
    return "https://www.youtube.com/embed/" + ch.id + "?autoplay=1";
  }
  function play(ch, btn) {
    player.src = srcFor(ch);
    var btns = document.querySelectorAll(".channels button");
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
    if (btn) btn.classList.add("active");
  }
  function playCustom() {
    var v = document.getElementById("vid").value.trim();
    if (v) play({ type: "video", id: v });
  }
  CHANNELS.forEach(function (ch, i) {
    var btn = document.createElement("button");
    btn.textContent = ch.name;
    btn.onclick = function () { play(ch, btn); };
    channelsEl.appendChild(btn);
    if (i === 0) play(ch, btn);
  });
</script>
</body>
</html>
