<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Live</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0e11; color:#e8eaed; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; background:#13171c; border-bottom:1px solid #222; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; font-weight:600; letter-spacing:.5px; }
  header h1 span { color:#fa6a00; }
  .channels { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; align-items:center; }
  .channels button { background:#1d232b; color:#cfd3d8; border:1px solid #2a323c; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px; transition:.15s; }
  .channels button:hover { background:#262d36; }
  .channels button.active { background:#fa6a00; color:#0b0e11; border-color:#fa6a00; font-weight:600; }
  .player { flex:1; position:relative; background:#000; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .status { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#8a9099; font-size:14px; text-align:center; z-index:2; pointer-events:none; }
  footer { padding:8px 20px; font-size:12px; color:#6b7178; background:#13171c; border-top:1px solid #222; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .custom input { background:#1d232b; border:1px solid #2a323c; color:#e8eaed; padding:5px 8px; border-radius:6px; font-size:13px; width:150px; }
  .custom button { background:#1d232b; border:1px solid #2a323c; color:#cfd3d8; padding:5px 10px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <h1><span>Bloomberg</span> Live</h1>
    <div class="channels" id="channels"></div>
  </header>
  <div class="player">
    <div class="status" id="status"></div>
    <iframe id="player" src="" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
  <footer>
    <span>跟随 Bloomberg TV 实时排播（亚洲时段自动显示亚洲节目）· 默认静音，点画面可取消静音</span>
    <span class="custom">手动视频ID: <input id="vid" placeholder="如 f39oHo6vFLg"><button onclick="playCustom()">播放</button></span>
  </footer>
<script>
  // 与原项目一致：不写死视频，而是实时解析频道"当前正在直播"的那条流。
  // 原项目走自己服务器的 /api/youtube/live?channel=@markets 抓取；
  // 静态托管没有服务器，这里用公共 CORS 代理抓 youtube.com/@markets/live 解析当前直播 videoId，
  // 全部失败时回退到频道直播嵌入 live_stream?channel=。
  var CHANNELS = [
    { name: "Bloomberg TV",   type: "live",  handle: "@markets",  channel: "UCIALMKvObZNtJ6AmdCLP7Lg" },
    { name: "Bloomberg 24/7", type: "video", id: "f39oHo6vFLg" }
  ];
  var player = document.getElementById("player");
  var channelsEl = document.getElementById("channels");
  var statusEl = document.getElementById("status");
  var current = null;

  var liveCache = {}; // handle -> { id, ts }
  var CACHE_TTL = 5 * 60 * 1000;

  function setStatus(t) { statusEl.textContent = t || ""; }
  function setActive(btn) {
    var btns = channelsEl.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
    if (btn) btn.classList.add("active");
  }

  function proxify(url) {
    return [
      "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
      "https://corsproxy.io/?url=" + encodeURIComponent(url)
    ];
  }

  function resolveLiveVideoId(handle) {
    var cached = liveCache[handle];
    if (cached && Date.now() - cached.ts < CACHE_TTL) return Promise.resolve(cached.id);
    var liveUrl = "https://www.youtube.com/" + handle + "/live";
    var urls = proxify(liveUrl);
    var idx = 0;
    function tryNext() {
      if (idx >= urls.length) return Promise.resolve(null);
      var u = urls[idx++];
      return fetch(u).then(function (r) {
        if (!r.ok) return tryNext();
        return r.text();
      }).then(function (html) {
        if (!html) return tryNext();
        var m = html.match(/<link rel="canonical" href="https:\/\/www\.youtube\.com\/watch\?v=([\w-]{11})">/);
        if (!m) m = html.match(/"videoId":"([\w-]{11})"/);
        if (m) { liveCache[handle] = { id: m[1], ts: Date.now() }; return m[1]; }
        return tryNext();
      }).catch(function () { return tryNext(); });
    }
    return tryNext();
  }

  function embedVideo(id) {
    setStatus("");
    player.src = "https://www.youtube.com/embed/" + id + "?autoplay=1&mute=1&rel=0&playsinline=1";
  }
  function embedChannelLive(channel) {
    setStatus("");
    player.src = "https://www.youtube.com/embed/live_stream?channel=" + channel + "&autoplay=1&mute=1";
  }

  function play(ch, btn) {
    current = ch;
    setActive(btn);
    if (ch.type === "video") { embedVideo(ch.id); return; }
    // live: 先解析当前直播 videoId，失败回退频道直播嵌入
    player.src = "about:blank";
    setStatus("正在获取当前直播…");
    resolveLiveVideoId(ch.handle).then(function (id) {
      if (current !== ch) return;
      if (id) embedVideo(id);
      else embedChannelLive(ch.channel);
    });
  }

  function playCustom() {
    var v = document.getElementById("vid").value.trim();
    if (v) { current = null; setActive(null); embedVideo(v); }
  }

  CHANNELS.forEach(function (ch, i) {
    var btn = document.createElement("button");
    btn.textContent = ch.name;
    btn.onclick = function () { play(ch, btn); };
    channelsEl.appendChild(btn);
    if (i === 0) play(ch, btn);
  });

  // 刷新当前直播按钮（重新解析，绕过缓存）
  var refreshBtn = document.createElement("button");
  refreshBtn.textContent = "\u21BB 刷新";
  refreshBtn.onclick = function () {
    if (current && current.type === "live") { liveCache[current.handle] = null; play(current); }
  };
  channelsEl.appendChild(refreshBtn);
</script>
</body>
</html>
