<!-- Player bootstrap, first in the document so the preload scanner starts the
     download immediately. Multi-CDN fallback; the static tag reports into it. -->
<script>
(function(){
  var MIRRORS = [
    "https://registry.npmmirror.com/hls.js/latest/files/dist/hls.min.js",
    "https://unpkg.com/hls.js@1/dist/hls.min.js"
  ];
  var TIMEOUT = 6000;
  var i = 0, settled = false, waiters = [], timer = null;
  function settle(ok){
    if(settled) return;
    settled = true;
    clearTimeout(timer);
    var pending = waiters.slice(); waiters.length = 0;
    pending.forEach(function(fn){ try{ fn(ok); }catch(e){} });
  }
  function next(){
    clearTimeout(timer);
    if(window.Hls) return settle(true);
    if(i >= MIRRORS.length) return settle(false);
    var el = document.createElement("script"), done = false;
    function fail(){
      if(done) return;
      done = true;
      try{ if(el.parentNode) el.parentNode.removeChild(el); }catch(e){}
      next();
    }
    timer = setTimeout(fail, TIMEOUT);
    el.async = true;
    el.src = MIRRORS[i++];
    el.onload = function(){ if(done) return; done = true; clearTimeout(timer); window.Hls ? settle(true) : fail(); };
    el.onerror = fail;
    document.head.appendChild(el);
  }
  window.__hlsOk   = function(){ window.Hls ? settle(true) : next(); };
  window.__hlsFail = function(){ next(); };
  window.__hlsReady = function(cb){
    if(window.Hls) return cb(true);
    if(settled) return cb(false);
    waiters.push(cb);
  };
  timer = setTimeout(function(){ if(!window.Hls) next(); }, TIMEOUT);
})();
</script>
<script async src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" onload="__hlsOk()" onerror="__hlsFail()"></script>

<!-- Connection warm up. Asking for the master playlist early does the DNS
     lookup, the TLS handshake and the manifest round trip while hls.js is
     still in flight, and the variant addresses name the segment host so that
     connection can be opened early too. Entirely optional; wrapped throughout. -->
<script>
(function(){
  if(!window.fetch || !window.URL) return;
  var BASE  = "https://www.bloomberg.com/media-manifest/streams/";
  var FILES = {asia:"asia.m3u8", phoenix:"phoenix-us.m3u8", us:"us.m3u8", eu:"eu.m3u8", aus:"aus.m3u8"};
  var id = "asia";
  try{ id = localStorage.getItem("bbg.source") || "asia"; }catch(e){}
  var url = BASE + (FILES[id] || FILES.asia);
  function preconnect(origin){
    try{
      if(document.querySelector('link[rel="preconnect"][href="' + origin + '"]')) return;
      var l = document.createElement("link");
      l.rel = "preconnect"; l.href = origin; l.crossOrigin = "";
      document.head.appendChild(l);
    }catch(e){}
  }
  try{
    fetch(url, {mode:"cors", credentials:"omit"}).then(function(r){
      return r && r.ok ? r.text() : "";
    }).then(function(txt){
      if(!txt) return;
      var lines = txt.split("\n"), seen = {}, found = 0;
      for(var i = 0; i < lines.length && found < 2; i++){
        var s = lines[i].trim();
        if(!s || s.charAt(0) === "#") continue;
        try{
          var o = new URL(s, url).origin;
          if(o && o.indexOf("http") === 0 && !seen[o]){ seen[o] = 1; found++; preconnect(o); }
        }catch(e){}
      }
    })["catch"](function(){});
  }catch(e){}
})();
</script>

<style>
  :root{
    --bg:#06070a;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.15);
    --text:#f4f6f8; --muted:#98a2ad; --faint:#5f6871;
    --accent:#ff6a00; --accent-2:#ff9a4d; --live:#27d17c;
    --radius:18px;
    --amb:rgba(255,106,0,.16);
    --pad-x:clamp(16px,3.2vw,34px);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --mark:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-feature-settings:'tnum' 1;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    height:100vh; height:100dvh; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .ambient{
    position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(48% 44% at 50% 12%, var(--amb), transparent 72%),
      radial-gradient(58% 50% at 90% -10%, rgba(255,106,0,.06), transparent 62%),
      radial-gradient(55% 48% at -8% 110%, rgba(38,92,170,.08), transparent 62%);
    filter:blur(56px) saturate(140%);
  }
  .app{position:relative; z-index:1; display:flex; flex-direction:column; height:100%;
    animation:appIn .34s cubic-bezier(.22,.61,.36,1) both;}
  @keyframes appIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

  /* ---------- Header ---------- */
  .bar{
    position:relative; z-index:10; flex:none;
    display:flex; align-items:center; gap:clamp(12px,2vw,22px); flex-wrap:wrap;
    padding:14px var(--pad-x);
    background:linear-gradient(180deg,rgba(12,16,21,.86),rgba(12,16,21,.42));
    backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  .bar::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,106,0,.4),transparent);}
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .mark{flex:none; width:9px; height:23px; border-radius:3px;
    background:linear-gradient(180deg,var(--accent),#ff8f39);
    box-shadow:0 0 20px rgba(255,106,0,.5);}
  .brand h1{font-family:var(--mark); font-size:clamp(20px,2.4vw,25px); font-weight:700;
    letter-spacing:-.026em; line-height:1; color:#fff; white-space:nowrap;}
  .sep{width:1px; height:15px; background:var(--line-strong);}
  .sub{font-size:10px; font-weight:600; letter-spacing:.24em; color:var(--faint); white-space:nowrap;}

  .live{display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px;
    background:rgba(39,209,124,.10); border:1px solid rgba(39,209,124,.32); color:#73e6a9;
    font-family:inherit; font-size:11px; font-weight:700; letter-spacing:.14em; cursor:default;
    transition:background .22s, border-color .22s, color .22s;}
  .live .dot{width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.9s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,209,124,.5);}70%{box-shadow:0 0 0 8px rgba(39,209,124,0);}100%{box-shadow:0 0 0 0 rgba(39,209,124,0);}}
  .live.behind{background:rgba(255,106,0,.11); border-color:rgba(255,106,0,.36); color:var(--accent-2);
    letter-spacing:.04em; cursor:pointer;}
  .live.behind .dot{background:var(--accent); animation:none;}
  .live.behind:hover{background:rgba(255,106,0,.18);}

  .clocks{margin-left:auto; display:flex; align-items:flex-start; gap:clamp(11px,1.5vw,22px);}
  .clock{display:flex; flex-direction:column; gap:3px; align-items:flex-end;}
  .clock[hidden]{display:none;}
  .clock .tz{font-size:9.5px; font-weight:600; letter-spacing:.16em; color:var(--faint); white-space:nowrap;}
  .clock time{font-size:14px; font-weight:500; letter-spacing:.02em; color:var(--text);
    font-variant-numeric:tabular-nums; line-height:1.1;}
  .session{font-size:9.5px; font-weight:700; letter-spacing:.1em; padding:1px 6px; border-radius:4px;
    border:1px solid transparent; white-space:nowrap;}
  .session.on{color:#73e6a9; background:rgba(39,209,124,.1); border-color:rgba(39,209,124,.26);}
  .session.pre{color:var(--accent-2); background:rgba(255,106,0,.1); border-color:rgba(255,106,0,.26);}
  .session.off{color:var(--faint); background:rgba(255,255,255,.04); border-color:var(--line);}

  /* ---------- Stage ---------- */
  .stage{flex:1 1 auto; min-height:0; display:flex; padding:clamp(14px,2.2vw,26px) var(--pad-x) 0;}
  .screen{position:relative; flex:1 1 auto; min-height:0; min-width:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius); overflow:hidden; background:#000;
    box-shadow:0 36px 96px rgba(0,0,0,.64), 0 0 0 1px rgba(255,255,255,.05);}
  .screen.mutedState{cursor:pointer;}
  .screen::before{content:""; position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:var(--radius);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.08);}
  .screen video{position:relative; z-index:1; width:100%; height:100%; object-fit:contain; background:#000;}

  /* ---------- Cinema layout ----------
     The black bars down both sides are the chrome, not the broadcast: once a
     header and a rail have taken their share of the height, what remains is
     wider than 16:9, and a 16:9 picture can only fill such a box by height.
     Floating both bars over the picture makes the stage the whole viewport, so
     a 16:9 feed on a 16:9 screen fills it edge to edge. The bars then fade
     after a few idle seconds and return on any input. */
  body.cinema .stage{padding:0;}
  body.cinema .screen{border-radius:0; box-shadow:none;}
  body.cinema .screen::before{display:none;}
  body.cinema .bar,
  body.cinema .rail{
    position:fixed; left:0; right:0; z-index:30;
    padding-left:max(var(--pad-x), env(safe-area-inset-left));
    padding-right:max(var(--pad-x), env(safe-area-inset-right));
    transition:opacity .3s ease, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  body.cinema .bar{top:0;}
  body.cinema .rail{bottom:0; padding-top:20px; padding-bottom:16px;
    background:linear-gradient(0deg,rgba(4,6,9,.94),rgba(4,6,9,.66) 55%,rgba(4,6,9,0));}
  body.cinema.idle .bar{opacity:0; transform:translateY(-101%); pointer-events:none;}
  body.cinema.idle .rail{opacity:0; transform:translateY(101%); pointer-events:none;}
  body.cinema.idle{cursor:none;}

  /* ---------- Connection state ---------- */
  .state{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:15px; text-align:center;
    color:var(--muted); pointer-events:none; padding:0 24px;}
  .state[hidden]{display:none;}
  .state.error{pointer-events:auto;}
  .spinner{width:28px; height:28px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.13); border-top-color:var(--accent); animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .glyph{display:none; width:30px; height:30px; color:var(--accent-2);}
  .state.error .spinner{display:none;}
  .state.error .glyph{display:block;}
  .stateText{font-size:14px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  .stateSub{font-size:11.5px; font-weight:400; letter-spacing:.03em; color:var(--faint); max-width:34ch; line-height:1.5;}
  .stateSub:empty{display:none;}
  .retryNow{display:none; padding:7px 15px; border-radius:9px; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid var(--line-strong); color:var(--text);
    font-family:inherit; font-size:12.5px; font-weight:500; transition:background .18s, border-color .18s;}
  .retryNow:hover{background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.26);}
  .state.error .retryNow{display:inline-flex;}

  .hint{position:absolute; bottom:58px; left:50%; transform:translateX(-50%); z-index:5; display:none;
    align-items:center; gap:8px; padding:9px 16px; border-radius:999px;
    background:rgba(6,8,10,.66); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.11); color:var(--text); font-size:12.5px; font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.4); pointer-events:none;}
  .hint.show{display:flex; animation:hintFade 5.5s ease forwards;}
  .hint svg{width:15px; height:15px; fill:var(--accent);}
  @keyframes hintFade{0%{opacity:0; transform:translateX(-50%) translateY(8px);}12%,72%{opacity:1; transform:translateX(-50%) translateY(0);}100%{opacity:0; transform:translateX(-50%) translateY(8px); visibility:hidden;}}

  /* ---------- Status rail ---------- */
  .rail{position:relative; z-index:20; flex:none;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:11px var(--pad-x) 13px; font-size:11px; font-weight:500; letter-spacing:.05em;
    color:var(--faint); font-variant-numeric:tabular-nums;}
  .rail .sep-dot{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.45;}
  .rail .spacer{flex:1 1 auto;}
  .keys{display:flex; align-items:center; gap:11px; letter-spacing:.04em;}
  .keys span{display:inline-flex; align-items:center; gap:5px;}
  kbd{font-family:inherit; font-size:9.5px; font-weight:600; letter-spacing:.04em; padding:2px 5px;
    border-radius:4px; border:1px solid var(--line-strong); background:rgba(255,255,255,.03); color:var(--muted);}
  #statLat.catching{color:var(--accent-2);}
  #statBuf.thin{color:var(--accent-2);}

  /* Selectors, and three plain buttons. A keyboard shortcut is not a control:
     play, mute and fullscreen used to be reachable only by key, which on a
     television means not reachable at all. */
  .qsel{position:relative; display:inline-flex;}
  .q-btn{display:inline-flex; align-items:center; gap:7px; padding:4px 9px; margin:-4px 0;
    border-radius:8px; border:1px solid transparent; background:transparent;
    font:inherit; font-size:11px; font-weight:500; letter-spacing:.05em; color:var(--faint);
    font-variant-numeric:tabular-nums; cursor:pointer; white-space:nowrap;
    transition:color .18s, background .18s, border-color .18s;}
  .q-btn:hover:not(:disabled){color:var(--text); background:rgba(255,255,255,.05); border-color:var(--line);}
  .q-btn[aria-expanded="true"]{color:var(--text); background:rgba(255,255,255,.06); border-color:rgba(255,154,77,.34);}
  .q-btn:disabled{cursor:default;}
  .q-mode{color:var(--muted); transition:color .18s;}
  .q-btn:hover:not(:disabled) .q-mode,.q-btn[aria-expanded="true"] .q-mode{color:var(--accent-2);}
  .q-btn.fallen .q-mode{color:var(--accent-2);}
  .q-thin{width:1px; height:9px; background:currentColor; opacity:.32;}
  .q-chev{width:9px; height:9px; opacity:.5; transition:transform .2s cubic-bezier(.2,.8,.2,1), opacity .18s;}
  .q-btn:disabled .q-chev{opacity:0;}
  .q-btn[aria-expanded="true"] .q-chev{transform:rotate(180deg); opacity:.95;}
  .ci{width:12px; height:12px; flex:none; opacity:.92;}

  .q-pop{position:absolute; bottom:calc(100% + 12px); left:-6px; z-index:40;
    width:252px; max-width:calc(100vw - 32px); padding:6px; border-radius:14px;
    background:rgba(10,13,17,.9);
    backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 26px 64px rgba(0,0,0,.68), inset 0 1px 0 rgba(255,255,255,.07);
    transform-origin:bottom left; animation:popIn .16s cubic-bezier(.2,.8,.2,1) both;}
  .q-pop[hidden]{display:none;}
  #sMenu{width:276px;}
  @keyframes popIn{from{opacity:0; transform:translateY(7px) scale(.98);}to{opacity:1; transform:none;}}
  .q-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px 9px; font-size:9.5px; font-weight:700; letter-spacing:.2em; color:var(--faint);}
  .q-head b{font-weight:700; color:var(--muted); letter-spacing:.16em;}
  .q-list{display:flex; flex-direction:column; gap:1px;}
  .q-item{position:relative; display:flex; align-items:center; gap:9px; width:100%;
    padding:9px 11px 9px 15px; border:0; border-radius:9px; background:transparent; text-align:left;
    font:inherit; font-size:13px; font-weight:500; color:#c8d0d8; cursor:pointer;
    font-variant-numeric:tabular-nums; transition:background .14s, color .14s;}
  .q-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .q-bar{position:absolute; left:5px; top:50%; width:2px; height:15px; margin-top:-7.5px; border-radius:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    transform:scaleY(0); transition:transform .2s cubic-bezier(.2,.8,.2,1);}
  .q-item[aria-selected="true"]{color:#fff; background:rgba(255,255,255,.045);}
  .q-item[aria-selected="true"] .q-bar{transform:scaleY(1);}
  .q-lbl{flex:1 1 auto;}
  .q-badge{flex:none; font-size:8.5px; font-weight:700; letter-spacing:.08em; padding:2px 5px; border-radius:4px;
    background:rgba(255,255,255,.07); color:var(--muted);}
  .q-badge.is-fhd{background:rgba(255,106,0,.17); color:var(--accent-2);}
  .q-rate{flex:none; font-size:10.5px; font-weight:500; letter-spacing:.03em; color:var(--faint);}
  .q-foot{margin-top:4px; padding:8px 11px 6px; border-top:1px solid var(--line);
    font-size:10px; font-weight:400; letter-spacing:.04em; line-height:1.5; color:var(--faint);}
  .q-foot[hidden]{display:none;}

  :focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px;}

  /* ---------- Television ----------
     Ten feet away everything above is too small, and a remote cannot hover, so
     the focused control has to be unmistakable rather than merely tinted. */
  body.tv .rail{gap:14px; font-size:13px; padding-top:22px; padding-bottom:20px;}
  body.tv .q-btn{font-size:13.5px; padding:9px 14px; margin:0;}
  body.tv .ci{width:15px; height:15px;}
  body.tv .q-item{font-size:15px; padding:12px 14px 12px 18px;}
  body.tv .q-pop{width:320px;}
  body.tv #sMenu{width:340px;}
  body.tv .clock time{font-size:16px;}
  body.tv .keys{display:none;}
  body.tv .q-btn:focus{outline:0; color:#fff; background:rgba(255,255,255,.1);
    border-color:var(--accent); box-shadow:0 0 0 2px rgba(255,106,0,.45);}
  body.tv .q-btn:focus .q-mode{color:var(--accent-2);}
  body.tv .q-item:focus{outline:0; color:#fff; background:rgba(255,106,0,.16);
    box-shadow:inset 0 0 0 1px rgba(255,106,0,.5);}
  body.tv .live:focus{outline:0; box-shadow:0 0 0 2px rgba(255,106,0,.45);}

  .noscript{position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:14px; text-align:center; padding:24px;}

  /* Five clocks cannot fit forever. New York stays because the feed is
     anchored to that session, and the local column because it is the
     viewer's own. */
  @media (max-width:1240px){ .keys{display:none;} }
  @media (max-width:1040px){ #clockSeoul{display:none;} }
  @media (max-width:900px){ #clockLondon{display:none;} }
  @media (max-width:760px){ #clockHk{display:none;} }
  @media (max-width:680px){
    .bar{padding:12px var(--pad-x); gap:10px;}
    .sep,.sub{display:none;}
    .clocks{gap:14px;}
    .clock .tz{font-size:9px;}
    .clock time{font-size:12.5px;}
    .session{font-size:9px; padding:1px 5px;}
    .rail .m-hide{display:none;}
    .hint{bottom:46px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Bloomberg</h1>

      <span><kbd>空格</kbd>播放</span><span><kbd>M</kbd>静音</span><span><kbd>F</kbd>全屏</span><span><kbd>L</kbd>回到直播</span><span><kbd>S</kbd>切换信号源</span>

<noscript><div class="noscript">该页面需要启用 JavaScript 才能播放直播流。</div></noscript>

<script>
(function(){
  "use strict";

  /* Parallel Bloomberg feeds. The L-bar graphics package is baked into the
     encoded picture, not an overlay, and nothing in the manifest declares it,
     so it has to be a choice. ASIA leads because its origin is nearest. */
  var SOURCES = [
    {id:"asia",    name:"ASIA",   note:"亚洲 · 回源最近", url:"https://www.bloomberg.com/media-manifest/streams/asia.m3u8"},
    {id:"phoenix", name:"US ALT", note:"美东 · 带行情条", url:"https://www.bloomberg.com/media-manifest/streams/phoenix-us.m3u8"},
    {id:"us",      name:"US",     note:"美国 · 数字版",   url:"https://www.bloomberg.com/media-manifest/streams/us.m3u8"},
    {id:"eu",      name:"EUROPE", note:"欧洲频道",       url:"https://www.bloomberg.com/media-manifest/streams/eu.m3u8"},
    {id:"aus",     name:"AU",     note:"澳洲频道",       url:"https://www.bloomberg.com/media-manifest/streams/aus.m3u8"}
  ];
  function sourceById(id){
    for(var si = 0; si < SOURCES.length; si++) if(SOURCES[si].id === id) return SOURCES[si];
    return SOURCES[0];
  }

  /* One time reset: the pinned era wrote an explicit 1080p into storage, which
     would be read back and re-applied as a hard lock on every load. */
  try{
    if(localStorage.getItem("bbg.pref") !== "2"){
      localStorage.removeItem("bbg.quality");
      localStorage.setItem("bbg.pref", "2");
    }
  }catch(e){}

  var currentSource = SOURCES[0];
  try{
    var savedSource = localStorage.getItem("bbg.source");
    if(savedSource) currentSource = sourceById(savedSource);
  }catch(e){}
  function streamUrl(){ return currentSource.url; }

  /* Auto by default, and auto means auto. An explicit pick is a real lock.
     Stored as a picture height, never a level index: indices belong to one
     manifest and would point at an unrelated rung on another feed. */
  var DEFAULT_QUALITY = "auto";
  var prefQuality = DEFAULT_QUALITY;
  try{
    var savedQuality = localStorage.getItem("bbg.quality");
    if(savedQuality) prefQuality = savedQuality;
  }catch(e){}
  function savePref(v){
    prefQuality = v;
    try{ localStorage.setItem("bbg.quality", v); }catch(e){}
  }

  var video    = document.getElementById("video");
  var screenEl = document.getElementById("screen");
  var stateEl  = document.getElementById("state");
  var stateTxt = document.getElementById("stateText");
  var stateSub = document.getElementById("stateSub");
  var retryBtn = document.getElementById("retryNow");
  var hintEl   = document.getElementById("hint");
  var liveBtn  = document.getElementById("liveBtn");
  var liveTxt  = document.getElementById("liveTxt");
  var statRate = document.getElementById("statRate");
  var statBuf  = document.getElementById("statBuf");
  var statLat  = document.getElementById("statLat");

  var sBtn  = document.getElementById("sBtn");
  var sName = document.getElementById("sName");
  var sMenu = document.getElementById("sMenu");
  var sList = document.getElementById("sList");

  var qBtn  = document.getElementById("qBtn");
  var qMode = document.getElementById("qMode");
  var qRes  = document.getElementById("qRes");
  var qMenu = document.getElementById("qMenu");
  var qList = document.getElementById("qList");
  var qFoot = document.getElementById("qFoot");
  var qSrc  = document.getElementById("qSrc");

  var playBtn  = document.getElementById("playBtn");
  var playTxt  = document.getElementById("playTxt");
  var playIcon = document.getElementById("playIcon");
  var muteBtn  = document.getElementById("muteBtn");
  var muteTxt  = document.getElementById("muteTxt");
  var fsBtn    = document.getElementById("fsBtn");
  var fsTxt    = document.getElementById("fsTxt");

  var ICON_PLAY  = "M8 5v14l11-7z";
  var ICON_PAUSE = "M7 5h3.4v14H7zm6.6 0H17v14h-3.4z";

  var hls = null;
  var retryTimer = null, countdownTimer = null;
  var retryCount = 0, netRecovery = 0, mediaRecovery = 0;
  var measuredBps = 0;
  var fragSecs = 0;
  var heightIndex = {};

  /* The rung asked for, as a height: hls.js renumbers hls.levels when it drops
     a failing one, so a captured index would later mean something else. */
  var lockedHeight = null;
  var relockTries = 0, relockTimer = null;
  var RELOCK_DELAYS = [4000, 10000, 20000];

  var LOCK_OK    = "已锁定该档位，不会再自动变动。如果卡顿，改回「自动」让播放器自己根据实际带宽选择。";
  var LOCK_RETRY = "该档位刚才加载失败，播放器临时退到了低档保住画面。正在切回——如果反复发生，说明当前线路喂不动这一档。";
  var LOCK_LOST  = "该档位在当前线路上持续加载失败，已停止重试，以免来回切换反而更卡。换一个更近的信号源，或改回「自动」。";

  function noop(){}
  function setTitle(prefix){ document.title = prefix ? (prefix + " · Bloomberg Live") : "Bloomberg Live"; }
  function nativeOk(){ return !!video.canPlayType("application/vnd.apple.mpegurl"); }

  function showLoading(text, sub){
    stateEl.hidden = false; stateEl.classList.remove("error");
    stateTxt.textContent = text; stateSub.textContent = sub || "";
    setTitle(retryCount ? "重连中" : "");
  }
  function showError(sub){
    stateEl.hidden = false; stateEl.classList.add("error");
    stateSub.textContent = sub || ""; setTitle("重连中");
  }
  function clearState(){
    stateEl.hidden = true; stateEl.classList.remove("error");
    stateTxt.textContent = ""; stateSub.textContent = ""; setTitle("");
  }
  function showHint(){ hintEl.classList.remove("show"); void hintEl.offsetWidth; hintEl.classList.add("show"); }
  function destroyHls(){ if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } }

  function backoffMs(n){
    var steps = [3000, 5000, 8000, 13000, 21000, 30000];
    return steps[Math.min(n - 1, steps.length - 1)];
  }
  function scheduleRetry(reason, sub){
    retryCount++;
    var wait = backoffMs(retryCount), due = Date.now() + wait;
    var label = reason || "直播连接中断";
    showError(sub);
    clearInterval(countdownTimer);
    function tick(){
      var left = Math.max(0, Math.ceil((due - Date.now()) / 1000));
      stateTxt.textContent = label + " · " + left + " 秒后重试（第 " + retryCount + " 次）";
    }
    tick();
    countdownTimer = setInterval(tick, 250);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(playHls, wait);
  }
  function retryNow(){ clearTimeout(retryTimer); clearInterval(countdownTimer); playHls(); }
  retryBtn.addEventListener("click", retryNow);

  /* ---------- Popovers ---------- */
  function closeMenu(btn, pop){
    pop.hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
  function closeAllMenus(){ closeMenu(qBtn, qMenu); closeMenu(sBtn, sMenu); }
  function openMenu(btn, pop, list){
    if(btn.disabled) return;
    closeAllMenus();
    pop.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    var sel = list.querySelector('.q-item[aria-selected="true"]') || list.querySelector(".q-item");
    if(sel) sel.focus();
  }
  function wireMenu(btn, pop, list){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(pop.hidden) openMenu(btn, pop, list); else closeMenu(btn, pop);
    });
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    pop.addEventListener("keydown", function(e){
      var items = [].slice.call(list.querySelectorAll(".q-item"));
      if(!items.length) return;
      var i = items.indexOf(document.activeElement), k = e.key;
      if(k === "ArrowDown" || k === "ArrowUp"){
        e.preventDefault();
        var n = (i < 0) ? 0 : (i + (k === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items[n].focus();
      } else if(k === "Home"){ e.preventDefault(); items[0].focus(); }
      else if(k === "End"){ e.preventDefault(); items[items.length - 1].focus(); }
      else if(k === "Escape" || k === "Tab"){ e.preventDefault(); closeMenu(btn, pop); btn.focus(); }
    });
  }
  wireMenu(sBtn, sMenu, sList);
  wireMenu(qBtn, qMenu, qList);
  document.addEventListener("click", closeAllMenus);
  function closeQMenu(){ closeMenu(qBtn, qMenu); }

  /* ---------- Cinema mode, idle chrome, remote ---------- */
  var body = document.body;
  var IDLE_MS = 4200;
  var idleTimer = null;

  /* The host app appends ?tv=1 when Android reports a television UI mode; the
     user agent test is only a fallback for a plain browser on a TV stick. */
  var isTv = /(^|[?&])tv=1(&|$)/.test(location.search) ||
    /Android TV|Google TV|GoogleTV|SMART-TV|SmartTV|BRAVIA|AFT[A-Z]|CrKey|Web0S|Tizen/i.test(navigator.userAgent || "");

  function inCinema(){ return body.classList.contains("cinema"); }

  function sleep(){
    if(!inCinema()) return;
    if(!qMenu.hidden || !sMenu.hidden) return;
    var a = document.activeElement;
    var onControl = !!(a && a.classList && (a.classList.contains("q-btn") || a.classList.contains("live")));
    if(onControl){
      /* With a remote, focus lives on a control permanently, so refusing to
         hide while anything is focused would mean never hiding. Drop the
         focus instead; any arrow key brings it back. */
      if(!isTv) return;
      try{ a.blur(); }catch(e){}
    }
    body.classList.add("idle");
  }
  function wake(){
    body.classList.remove("idle");
    clearTimeout(idleTimer);
    if(inCinema()) idleTimer = setTimeout(sleep, IDLE_MS);
  }

  function requestFs(){
    try{
      if(screenEl.requestFullscreen) screenEl.requestFullscreen();
      else if(screenEl.webkitRequestFullscreen) screenEl.webkitRequestFullscreen();
      else if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
    }catch(e){}
  }
  function exitFs(){
    try{
      var fn = document.exitFullscreen || document.webkitExitFullscreen;
      if((document.fullscreenElement || document.webkitFullscreenElement) && fn) fn.call(document);
    }catch(e){}
  }
  function setCinema(on){
    body.classList.toggle("cinema", !!on);
    fsTxt.textContent = on ? "退出全屏" : "全屏";
    wake();
  }
  /* Cinema and real fullscreen are requested together but do not depend on one
     another: an embedded WebView may refuse the fullscreen request, and when it
     does the bars still have to disappear. */
  function toggleFullscreen(){
    var on = !inCinema();
    setCinema(on);
    if(on) requestFs(); else exitFs();
  }
  document.addEventListener("fullscreenchange", function(){
    if(isTv) return;
    if(!(document.fullscreenElement || document.webkitFullscreenElement)) setCinema(false);
  });
  screenEl.addEventListener("dblclick", toggleFullscreen);
  fsBtn.addEventListener("click", function(e){ e.stopPropagation(); wake(); toggleFullscreen(); });

  playBtn.addEventListener("click", function(e){
    e.stopPropagation(); wake();
    if(video.paused) video.play().catch(noop); else video.pause();
  });
  muteBtn.addEventListener("click", function(e){
    e.stopPropagation(); wake();
    if(video.muted) unmute(); else video.muted = true;
  });

  function syncControls(){
    var paused = video.paused;
    playTxt.textContent = paused ? "播放" : "暂停";
    var p = playIcon.firstChild;
    if(p && p.setAttribute) p.setAttribute("d", paused ? ICON_PLAY : ICON_PAUSE);
    muteTxt.textContent = video.muted ? "取消静音" : "静音";
  }
  video.addEventListener("play", syncControls);
  video.addEventListener("pause", syncControls);

  /* Left to right along the rail, matching the visual order. A WebView will
     not reliably do spatial navigation by itself, so the walk is explicit. */
  var CTRLS = [sBtn, qBtn, playBtn, muteBtn, fsBtn];
  function liveCtrls(){
    return CTRLS.filter(function(b){ return b && !b.disabled && b.offsetParent !== null; });
  }
  function moveFocus(step){
    var list = liveCtrls();
    if(!list.length) return;
    var i = list.indexOf(document.activeElement);
    if(i < 0){ list[step > 0 ? 0 : list.length - 1].focus(); return; }
    list[(i + step + list.length) % list.length].focus();
  }
  function focusRail(){
    var list = liveCtrls();
    if(list.length) list[0].focus();
  }

  ["mousemove", "mousedown", "touchstart", "wheel"].forEach(function(evt){
    document.addEventListener(evt, wake, {passive:true});
  });

  if(isTv){
    body.classList.add("tv");
    /* System video controls cannot be driven by a remote and swallow the D-pad
       while on screen. The rail replaces them. */
    try{ video.removeAttribute("controls"); video.tabIndex = -1; }catch(e){}
    setCinema(true);
  }
  syncControls();

  /* ---------- Source selector ---------- */
  function buildSourceMenu(){
    var html = "";
    SOURCES.forEach(function(s){
      html += '<button class="q-item" type="button" role="option" aria-selected="' +
        (s.id === currentSource.id ? "true" : "false") + '" tabindex="-1" data-src="' + s.id + '">' +
        '<span class="q-bar" aria-hidden="true"></span>' +
        '<span class="q-lbl">' + s.name + '</span>' +
        '<span class="q-rate">' + s.note + '</span>' +
      '</button>';
    });
    sList.innerHTML = html;
    [].slice.call(sList.querySelectorAll(".q-item")).forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        closeMenu(sBtn, sMenu);
        sBtn.focus();
        selectSource(btn.dataset.src);
      });
    });
    sName.textContent = currentSource.name;
  }
  function selectSource(id){
    var s = sourceById(id);
    if(s.id === currentSource.id) return;
    currentSource = s;
    try{ localStorage.setItem("bbg.source", s.id); }catch(e){}
    [].slice.call(sList.querySelectorAll(".q-item")).forEach(function(b){
      b.setAttribute("aria-selected", b.dataset.src === s.id ? "true" : "false");
    });
    sName.textContent = s.name;

    /* A deliberate restart, not a failure: clear the backoff ladder, and drop
       the native src too or Safari keeps decoding the old feed underneath. */
    retryCount = 0; netRecovery = 0; mediaRecovery = 0;
    clearTimeout(retryTimer); clearInterval(countdownTimer);
    destroyHls();
    try{ video.pause(); video.removeAttribute("src"); video.load(); }catch(e){}
    playHls();
  }
  buildSourceMenu();

  /* ---------- Quality, built from real manifest levels ---------- */
  function levelLabel(l){ return l.height ? (l.height + "p") : (Math.round((l.bitrate || 0) / 1000) + "k"); }
  function levelBadge(l){ return l.height >= 1080 ? "FHD" : (l.height >= 720 ? "HD" : ""); }
  function rateLabel(bps){
    if(!bps) return "";
    return bps >= 1000000 ? (Math.round(bps / 100000) / 10 + " Mbps") : (Math.round(bps / 1000) + " kbps");
  }
  function itemHtml(level, label, badge, rate){
    return '<button class="q-item" type="button" role="option" aria-selected="false" tabindex="-1" data-level="' + level + '">' +
      '<span class="q-bar" aria-hidden="true"></span>' +
      '<span class="q-lbl">' + label + '</span>' +
      (badge ? '<span class="q-badge' + (badge === "FHD" ? " is-fhd" : "") + '">' + badge + '</span>' : '') +
      '<span class="q-rate">' + (rate || "") + '</span>' +
    '</button>';
  }
  function clearRelock(){
    clearTimeout(relockTimer);
    relockTimer = null;
    relockTries = 0;
    qBtn.classList.remove("fallen");
  }
  function resetQuality(){
    closeQMenu();
    qList.innerHTML = "";
    heightIndex = {};
    lockedHeight = null;
    clearRelock();
    qBtn.disabled = true;
    qBtn.title = "选择画质";
    qMode.textContent = (prefQuality === "auto") ? "自动" : (prefQuality + "p");
    qRes.textContent = "—";
    qSrc.textContent = "自适应";
    qFoot.hidden = true;
  }
  /* skipApply is for when the ladder changed underneath us: redraw the list,
     but do not re-resolve the preference, or a rung the player has just given
     up on would be requested all over again. */
  function buildQualityMenu(skipApply){
    if(!hls || !hls.levels || !hls.levels.length){ resetQuality(); return; }
    var idxs = hls.levels.map(function(l, i){ return i; }).sort(function(a, b){
      var la = hls.levels[a], lb = hls.levels[b];
      return (lb.height || 0) - (la.height || 0) || (lb.bitrate || 0) - (la.bitrate || 0);
    });
    var seen = {}, html = itemHtml("auto", "自动", "", "");
    heightIndex = {};
    idxs.forEach(function(i){
      var l = hls.levels[i], h = l.height || 0;
      if(seen[h]) return;

      heightIndex[h] = i;
      html += itemHtml(String(i), levelLabel(l), levelBadge(l), rateLabel(l.bitrate));
    });

    qBtn.disabled = false;
    [].slice.call(qList.querySelectorAll(".q-item")).forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var v = btn.dataset.level;
        clearRelock();
        if(v === "auto"){
          lockedHeight = null;
          applyLevel(-1);
          savePref("auto");
        } else {
          var idx = parseInt(v, 10), lv = hls.levels[idx];

          applyLevel(idx);

    });
    if(skipApply){
      var keep = (lockedHeight != null) ? indexForHeight(lockedHeight) : -1;
      setActiveQuality(keep >= 0 ? String(keep) : (lockedHeight != null ? "" : "auto"));

  /* A pick is a lock; -1 hands control back to the ladder. soft=true switches
     at the next fragment boundary instead of discarding the buffer. */
  function applyLevel(idx, soft){

     fragments keep failing is penalised and abandoned, which silently
     overrides a stated choice and lands on the bottom rung. So the choice is
     re-asserted, at most three times with widening gaps, and only ever back to
     the rung that was asked for. It never lowers anything by itself. */
  function enforceLock(){
    if(lockedHeight == null || !hls) return;
    var now = activeHeight();
    if(now === lockedHeight){
      clearRelock();
      qMode.textContent = lockedHeight + "p";
      qFoot.textContent = LOCK_OK;
      qFoot.hidden = false;
      return;
    }
    /* The label must never claim a rung we are not on. */
    qBtn.classList.add("fallen");
    qMode.textContent = lockedHeight + "p → " + (now ? (now + "p") : "—");
    qFoot.hidden = false;
    if(indexForHeight(lockedHeight) < 0 || relockTries >= RELOCK_DELAYS.length){
      qFoot.textContent = LOCK_LOST;
      return;
    }
    qFoot.textContent = LOCK_RETRY;
    clearTimeout(relockTimer);
    relockTimer = setTimeout(function(){
      relockTimer = null;
      if(lockedHeight == null || !hls) return;
      var j = indexForHeight(lockedHeight);
      if(j >= 0) applyLevel(j, true);

  /* Resolve a remembered height against the ladder this feed offers: exact
     match, then the best rung at or below it, then auto. */
  function applyPreferredLevel(){
    clearRelock();
    if(prefQuality === "auto"){
      lockedHeight = null;
      applyLevel(-1);
      setActiveQuality("auto");
      return;
    }
    var want = parseInt(prefQuality, 10);
    var heights = Object.keys(heightIndex).map(Number).sort(function(a, b){ return b - a; });
    if(!heights.length || !isFinite(want)){
      lockedHeight = null;
      applyLevel(-1);
      setActiveQuality("auto");
      return;
    }
    var pick = -1, i;
    for(i = 0; i < heights.length; i++){ if(heights[i] === want){ pick = heights[i]; break; } }
    if(pick < 0){ for(i = 0; i < heights.length; i++){ if(heights[i] <= want){ pick = heights[i]; break; } } }
    if(pick < 0){ lockedHeight = null; applyLevel(-1); setActiveQuality("auto"); return; }
    lockedHeight = pick;
    applyLevel(heightIndex[pick]);
    measuredBps = 0;
    setActiveQuality(String(heightIndex[pick]));

      qSrc.textContent = "自适应";
      qFoot.hidden = true;
    } else {
      var l = hls && hls.levels[parseInt(v, 10)];
      qMode.textContent = l ? levelLabel(l) : ((lockedHeight != null) ? (lockedHeight + "p") : "自动");

  /* On the auto row, report the rung the ladder has actually settled on. */

  function targetLatency(){

  function latency(){

    var b = video.buffered;

    return NaN;
  }
  /* Seconds of playable video ahead of the playhead. This is what predicts a

  var partsFmts = {};
