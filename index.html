<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">

<title>Bloomberg Live</title>

<!-- Player bootstrap, deliberately first.
     The library used to be fetched from the bottom of <body>, so the request
     could not start until the entire document had been parsed. Declaring it
     here lets the browser's preload scanner begin the download within the first
     few milliseconds, in parallel with CSS parsing. The multi-CDN fallback is
     kept: the static tag below reports failure into the same chain. -->
<script>
(function(){
  var MIRRORS = [
    "https://registry.npmmirror.com/hls.js/latest/files/dist/hls.min.js",
    "https://unpkg.com/hls.js@1/dist/hls.min.js"
  ];
  var TIMEOUT = 6000;
  var i = 0, settled = false, waiters = [], timer = null;

  function settle(ok){
    if(settled) return;
    settled = true;
    clearTimeout(timer);
    var pending = waiters.slice(); waiters.length = 0;
    pending.forEach(function(fn){ try{ fn(ok); }catch(e){} });
  }
  function next(){
    clearTimeout(timer);
    if(window.Hls) return settle(true);
    if(i >= MIRRORS.length) return settle(false);
    var el = document.createElement("script"), done = false;
    function fail(){
      if(done) return;
      done = true;
      try{ if(el.parentNode) el.parentNode.removeChild(el); }catch(e){}
      next();
    }
    timer = setTimeout(fail, TIMEOUT);
    el.async = true;
    el.src = MIRRORS[i++];
    el.onload = function(){ if(done) return; done = true; clearTimeout(timer); window.Hls ? settle(true) : fail(); };
    el.onerror = fail;
    document.head.appendChild(el);
  }

  window.__hlsOk   = function(){ window.Hls ? settle(true) : next(); };
  window.__hlsFail = function(){ next(); };
  /* Resolves immediately if the library is already present. */
  window.__hlsReady = function(cb){
    if(window.Hls) return cb(true);
    if(settled) return cb(false);
    waiters.push(cb);
  };
  /* A blocked CDN often hangs rather than erroring, so arm a watchdog too. */
  timer = setTimeout(function(){ if(!window.Hls) next(); }, TIMEOUT);
})();
</script>
<script async src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" onload="__hlsOk()" onerror="__hlsFail()"></script>

<style>
  :root{
    --bg:#06070a;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.15);
    --text:#f4f6f8; --muted:#98a2ad; --faint:#5f6871;
    --accent:#ff6a00; --accent-2:#ff9a4d; --live:#27d17c;
    --radius:18px;
    --amb:rgba(255,106,0,.16);
    --pad-x:clamp(16px,3.2vw,34px);
    /* System stack: renders instantly, needs no third party, cannot fail. */
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --mark:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-feature-settings:'tnum' 1;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    height:100vh; height:100dvh; overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Ambient light bled from the picture, sampled at ~1Hz. */
  .ambient{
    position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(48% 44% at 50% 12%, var(--amb), transparent 72%),
      radial-gradient(58% 50% at 90% -10%, rgba(255,106,0,.06), transparent 62%),
      radial-gradient(55% 48% at -8% 110%, rgba(38,92,170,.08), transparent 62%);
    filter:blur(56px) saturate(140%);
    transition:background 1.6s cubic-bezier(.4,0,.2,1);
  }
  .app{position:relative; z-index:1; display:flex; flex-direction:column; height:100%;
    animation:appIn .34s cubic-bezier(.22,.61,.36,1) both;}
  @keyframes appIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

  /* ---------- Header ---------- */
  .bar{
    position:relative; z-index:10; flex:none;
    display:flex; align-items:center; gap:clamp(12px,2vw,22px); flex-wrap:wrap;
    padding:14px var(--pad-x);
    background:linear-gradient(180deg,rgba(12,16,21,.86),rgba(12,16,21,.42));
    backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  .bar::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,106,0,.4),transparent);}
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .mark{flex:none; width:9px; height:23px; border-radius:3px;
    background:linear-gradient(180deg,var(--accent),#ff8f39);
    box-shadow:0 0 20px rgba(255,106,0,.5);}
  .brand h1{font-family:var(--mark); font-size:clamp(20px,2.4vw,25px); font-weight:700;
    letter-spacing:-.026em; line-height:1; color:#fff; white-space:nowrap;}
  .sep{width:1px; height:15px; background:var(--line-strong);}
  .sub{font-size:10px; font-weight:600; letter-spacing:.24em; color:var(--faint); white-space:nowrap;}

  .live{display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px;
    background:rgba(39,209,124,.10); border:1px solid rgba(39,209,124,.32); color:#73e6a9;
    font-family:inherit; font-size:11px; font-weight:700; letter-spacing:.14em; cursor:default;
    transition:background .22s, border-color .22s, color .22s;}
  .live .dot{width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.9s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,209,124,.5);}70%{box-shadow:0 0 0 8px rgba(39,209,124,0);}100%{box-shadow:0 0 0 0 rgba(39,209,124,0);}}
  .live.behind{background:rgba(255,106,0,.11); border-color:rgba(255,106,0,.36); color:var(--accent-2);
    letter-spacing:.04em; cursor:pointer;}
  .live.behind .dot{background:var(--accent); animation:none;}
  .live.behind:hover{background:rgba(255,106,0,.18);}

  .clocks{margin-left:auto; display:flex; align-items:flex-start; gap:clamp(14px,2vw,26px);}
  .clock{display:flex; flex-direction:column; gap:3px; align-items:flex-end;}
  .clock .tz{font-size:9.5px; font-weight:600; letter-spacing:.16em; color:var(--faint); white-space:nowrap;}
  .clock time{font-size:14px; font-weight:500; letter-spacing:.02em; color:var(--text);
    font-variant-numeric:tabular-nums; line-height:1.1;}
  .session{font-size:9.5px; font-weight:700; letter-spacing:.1em; padding:1px 6px; border-radius:4px;
    border:1px solid transparent;}
  .session.on{color:#73e6a9; background:rgba(39,209,124,.1); border-color:rgba(39,209,124,.26);}
  .session.pre{color:var(--accent-2); background:rgba(255,106,0,.1); border-color:rgba(255,106,0,.26);}
  .session.off{color:var(--faint); background:rgba(255,255,255,.04); border-color:var(--line);}

  /* ---------- Stage ---------- */
  .stage{flex:1 1 auto; min-height:0; display:flex; padding:clamp(14px,2.2vw,26px) var(--pad-x) 0;}
  .screen{position:relative; flex:1 1 auto; min-height:0; min-width:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius); overflow:hidden; background:#000;
    box-shadow:0 36px 96px rgba(0,0,0,.64), 0 0 0 1px rgba(255,255,255,.05);}
  .screen.mutedState{cursor:pointer;}
  .screen::before{content:""; position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:var(--radius);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.08);}
  .screen video{position:relative; z-index:1; width:100%; height:100%; object-fit:contain; background:#000;}
  .screen video::cue{background:rgba(0,0,0,.7); color:#fff; font-family:var(--font);
    font-size:.72em; line-height:1.35; text-shadow:0 1px 2px rgba(0,0,0,.6);}

  /* ---------- Connection state ---------- */
  .state{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:15px; text-align:center;
    color:var(--muted); pointer-events:none; padding:0 24px;}
  .state[hidden]{display:none;}
  .state.error{pointer-events:auto;}
  .spinner{width:28px; height:28px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.13); border-top-color:var(--accent); animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .glyph{display:none; width:30px; height:30px; color:var(--accent-2);}
  .state.error .spinner{display:none;}
  .state.error .glyph{display:block;}
  .stateText{font-size:14px; font-weight:500; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
  .stateSub{font-size:11.5px; font-weight:400; letter-spacing:.03em; color:var(--faint); max-width:34ch; line-height:1.5;}
  .stateSub:empty{display:none;}
  .retryNow{display:none; padding:7px 15px; border-radius:9px; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid var(--line-strong); color:var(--text);
    font-family:inherit; font-size:12.5px; font-weight:500; transition:background .18s, border-color .18s;}
  .retryNow:hover{background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.26);}
  .state.error .retryNow{display:inline-flex;}

  /* ---------- Unmute hint ---------- */
  .hint{position:absolute; bottom:58px; left:50%; transform:translateX(-50%); z-index:5; display:none;
    align-items:center; gap:8px; padding:9px 16px; border-radius:999px;
    background:rgba(6,8,10,.66); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.11); color:var(--text); font-size:12.5px; font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,.4); pointer-events:none;}
  .hint.show{display:flex; animation:hintFade 5.5s ease forwards;}
  .hint svg{width:15px; height:15px; fill:var(--accent);}
  @keyframes hintFade{0%{opacity:0; transform:translateX(-50%) translateY(8px);}12%,72%{opacity:1; transform:translateX(-50%) translateY(0);}100%{opacity:0; transform:translateX(-50%) translateY(8px); visibility:hidden;}}

  /* ---------- Status rail ---------- */
  .rail{position:relative; z-index:20; flex:none;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:11px var(--pad-x) 13px; font-size:11px; font-weight:500; letter-spacing:.05em;
    color:var(--faint); font-variant-numeric:tabular-nums;}
  .rail .sep-dot{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.45;}
  .rail .spacer{flex:1 1 auto;}
  .keys{display:flex; align-items:center; gap:11px; letter-spacing:.04em;}
  .keys span{display:inline-flex; align-items:center; gap:5px;}
  kbd{font-family:inherit; font-size:9.5px; font-weight:600; letter-spacing:.04em; padding:2px 5px;
    border-radius:4px; border:1px solid var(--line-strong); background:rgba(255,255,255,.03); color:var(--muted);}
  #statLat.catching{color:var(--accent-2);}

  /* ---------- Rail popovers ----------
     Two controls share this component: the signal source and the picture
     quality. Both are promoted from the readout they replace, so the thing
     that tells you the state is also the thing that changes it. No floating
     overlay, nothing covering the frame, nothing hidden behind :hover. */
  .qsel{position:relative; display:inline-flex;}
  .q-btn{display:inline-flex; align-items:center; gap:7px; padding:4px 9px; margin:-4px 0;
    border-radius:8px; border:1px solid transparent; background:transparent;
    font:inherit; font-size:11px; font-weight:500; letter-spacing:.05em; color:var(--faint);
    font-variant-numeric:tabular-nums; cursor:pointer; white-space:nowrap;
    transition:color .18s, background .18s, border-color .18s;}
  .q-btn:hover:not(:disabled){color:var(--text); background:rgba(255,255,255,.05); border-color:var(--line);}
  .q-btn[aria-expanded="true"]{color:var(--text); background:rgba(255,255,255,.06); border-color:rgba(255,154,77,.34);}
  .q-btn:disabled{cursor:default;}
  .q-mode{color:var(--muted); transition:color .18s;}
  .q-btn:hover:not(:disabled) .q-mode,.q-btn[aria-expanded="true"] .q-mode{color:var(--accent-2);}
  .q-thin{width:1px; height:9px; background:currentColor; opacity:.32;}
  .q-chev{width:9px; height:9px; opacity:.5; transition:transform .2s cubic-bezier(.2,.8,.2,1), opacity .18s;}
  .q-btn:disabled .q-chev{opacity:0;}
  .q-btn[aria-expanded="true"] .q-chev{transform:rotate(180deg); opacity:.95;}

  .q-pop{position:absolute; bottom:calc(100% + 12px); left:-6px; z-index:40;
    width:252px; max-width:calc(100vw - 32px); padding:6px; border-radius:14px;
    background:rgba(10,13,17,.9);
    backdrop-filter:blur(26px) saturate(170%); -webkit-backdrop-filter:blur(26px) saturate(170%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 26px 64px rgba(0,0,0,.68), inset 0 1px 0 rgba(255,255,255,.07);
    transform-origin:bottom left; animation:popIn .16s cubic-bezier(.2,.8,.2,1) both;}
  .q-pop[hidden]{display:none;}
  #sMenu{width:276px;}
  @keyframes popIn{from{opacity:0; transform:translateY(7px) scale(.98);}to{opacity:1; transform:none;}}
  .q-head{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px 9px; font-size:9.5px; font-weight:700; letter-spacing:.2em; color:var(--faint);}
  .q-head b{font-weight:700; color:var(--muted); letter-spacing:.16em;}
  .q-list{display:flex; flex-direction:column; gap:1px;}
  .q-item{position:relative; display:flex; align-items:center; gap:9px; width:100%;
    padding:9px 11px 9px 15px; border:0; border-radius:9px; background:transparent; text-align:left;
    font:inherit; font-size:13px; font-weight:500; color:#c8d0d8; cursor:pointer;
    font-variant-numeric:tabular-nums; transition:background .14s, color .14s;}
  .q-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .q-bar{position:absolute; left:5px; top:50%; width:2px; height:15px; margin-top:-7.5px; border-radius:2px;
    background:linear-gradient(180deg,var(--accent),var(--accent-2));
    transform:scaleY(0); transition:transform .2s cubic-bezier(.2,.8,.2,1);}
  .q-item[aria-selected="true"]{color:#fff; background:rgba(255,255,255,.045);}
  .q-item[aria-selected="true"] .q-bar{transform:scaleY(1);}
  .q-lbl{flex:1 1 auto;}
  .q-badge{flex:none; font-size:8.5px; font-weight:700; letter-spacing:.08em; padding:2px 5px; border-radius:4px;
    background:rgba(255,255,255,.07); color:var(--muted);}
  .q-badge.is-fhd{background:rgba(255,106,0,.17); color:var(--accent-2);}
  .q-rate{flex:none; font-size:10.5px; font-weight:500; letter-spacing:.03em; color:var(--faint);}
  .q-foot{margin-top:4px; padding:8px 11px 6px; border-top:1px solid var(--line);
    font-size:10px; font-weight:400; letter-spacing:.04em; line-height:1.5; color:var(--faint);}
  .q-foot[hidden]{display:none;}

  :focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:6px;}

  .noscript{position:fixed; inset:0; z-index:99; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:14px; text-align:center; padding:24px;}

  @media (max-width:900px){
    .keys{display:none;}
  }
  @media (max-width:680px){
    .bar{padding:12px var(--pad-x); gap:10px;}
    .sep,.sub{display:none;}
    .clocks{gap:14px;}
    .clock .tz{font-size:9px;}
    .clock time{font-size:12.5px;}
    .rail .m-hide{display:none;}
    .hint{bottom:46px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important;
      transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"></div>
<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>Bloomberg</h1>
      <span class="sep" aria-hidden="true"></span>
      <span class="sub">TELEVISION</span>
    </div>
    <button class="live" id="liveBtn" type="button" title="回到直播边缘（L）">
      <span class="dot" aria-hidden="true"></span><span id="liveTxt">LIVE</span>
    </button>
    <div class="clocks">
      <div class="clock">
        <span class="tz">NEW YORK</span>
        <time id="nyTime">--:--:--</time>
        <span class="session off" id="session">—</span>
      </div>
      <div class="clock">
        <span class="tz" id="localTz">LOCAL</span>
        <time id="localTime">--:--:--</time>
      </div>
    </div>
  </header>

  <main class="stage">
    <div class="screen mutedState" id="screen">
      <div class="state" id="state">
        <div class="spinner" aria-hidden="true"></div>
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 1.8 20.6h20.4L12 3Z"/><path d="M12 10v4.3"/><path d="M12 17.7h.01"/></svg>
        <p class="stateText" id="stateText" aria-live="polite"></p>
        <p class="stateSub" id="stateSub"></p>
        <button class="retryNow" id="retryNow" type="button">立即重试</button>
      </div>

      <div class="hint" id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg><span>点击画面可取消静音</span></div>

      <video id="video" playsinline controls style="display:none"></video>
    </div>
  </main>

  <footer class="rail">
    <div class="qsel">
      <button class="q-btn" id="sBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sMenu" title="切换信号源（S）">
        <span class="q-mode">信号源</span>
        <span class="q-thin" aria-hidden="true"></span>
        <span id="sName">US ALT</span>
        <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <div class="q-pop" id="sMenu" role="listbox" aria-label="信号源" hidden>
        <div class="q-head"><b>信号源</b><span>BLOOMBERG</span></div>
        <div class="q-list" id="sList"></div>
        <div class="q-foot">各路信号的播出包装不同。经典 L 型版面（主画面居左上、下方滚动新闻、右侧滚动行情）烧录在画面里，不是网页叠加的元素。</div>
      </div>
    </div>

    <span class="sep-dot" aria-hidden="true"></span>

    <div class="qsel">
      <button class="q-btn" id="qBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="qMenu" title="选择画质" disabled>
        <span class="q-mode" id="qMode">1080p</span>
        <span class="q-thin" aria-hidden="true"></span>
        <span id="qRes">—</span>
        <svg class="q-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <div class="q-pop" id="qMenu" role="listbox" aria-label="画质" hidden>
        <div class="q-head"><b>画质</b><span id="qSrc">自适应</span></div>
        <div class="q-list" id="qList"></div>
        <div class="q-foot" id="qFoot" hidden>已锁定该档位，带宽不足时不再自动降档。选择「自动」可恢复自适应。</div>
      </div>
    </div>

    <span class="sep-dot m-hide" aria-hidden="true"></span>
    <span class="m-hide" id="statRate" title="根据最近几个已缓冲分片实测的平均编码码率">码率 —</span>
    <span class="sep-dot" aria-hidden="true"></span>
    <span id="statLat" title="当前画面距离直播边缘的真实时间差">延迟 —</span>
    <span class="spacer"></span>
    <span class="keys">
      <span><kbd>空格</kbd>播放</span><span><kbd>M</kbd>静音</span><span><kbd>F</kbd>全屏</span><span><kbd>L</kbd>回到直播</span><span><kbd>S</kbd>信号源</span>
    </span>
  </footer>
</div>

<noscript><div class="noscript">该页面需要启用 JavaScript 才能播放直播流。</div></noscript>

<script>
(function(){
  "use strict";

  /* ---------- Signal sources ----------
     Bloomberg publishes several parallel live feeds. The newsroom is the same,
     but the broadcast graphics package baked into the video differs: the
     classic L-bar layout (main picture top-left, news crawl along the bottom,
     quote rail down the right side) is part of the encoded picture, not an
     overlay we could add or remove. Nothing in the manifest declares this, so
     it cannot be detected — it has to be a choice, and it is remembered.
     phoenix-us leads the list because it is the feed that carries the full
     package; SOURCES[0] is the first-visit default. */
  var SOURCES = [
    {id:"phoenix", name:"US ALT", note:"美国 · Phoenix",  url:"https://www.bloomberg.com/media-manifest/streams/phoenix-us.m3u8"},
    {id:"us",      name:"US",     note:"美国 · 数字版",  url:"https://www.bloomberg.com/media-manifest/streams/us.m3u8"},
    {id:"eu",      name:"EUROPE", note:"欧洲频道",      url:"https://www.bloomberg.com/media-manifest/streams/eu.m3u8"},
    {id:"asia",    name:"ASIA",   note:"亚洲频道",      url:"https://www.bloomberg.com/media-manifest/streams/asia.m3u8"},
    {id:"aus",     name:"AU",     note:"澳洲频道",      url:"https://www.bloomberg.com/media-manifest/streams/aus.m3u8"}
  ];
  function sourceById(id){
    for(var si = 0; si < SOURCES.length; si++) if(SOURCES[si].id === id) return SOURCES[si];
    return SOURCES[0];
  }
  var currentSource = SOURCES[0];
  try{
    var savedSource = localStorage.getItem("bbg.source");
    if(savedSource) currentSource = sourceById(savedSource);
  }catch(e){}
  function streamUrl(){ return currentSource.url; }

  /* ---------- Quality preference ----------
     Stored as a picture height, never as a level index: indices are specific
     to one manifest and would point at an unrelated rung on another feed. */
  var DEFAULT_HEIGHT = "1080";
  var prefQuality = DEFAULT_HEIGHT;
  try{
    var savedQuality = localStorage.getItem("bbg.quality");
    if(savedQuality) prefQuality = savedQuality;
  }catch(e){}
  function savePref(v){
    prefQuality = v;
    try{ localStorage.setItem("bbg.quality", v); }catch(e){}
  }

  var video    = document.getElementById("video");
  var screenEl = document.getElementById("screen");
  var stateEl  = document.getElementById("state");
  var stateTxt = document.getElementById("stateText");
  var stateSub = document.getElementById("stateSub");
  var retryBtn = document.getElementById("retryNow");
  var hintEl   = document.getElementById("hint");
  var liveBtn  = document.getElementById("liveBtn");
  var liveTxt  = document.getElementById("liveTxt");
  var statRate = document.getElementById("statRate");
  var statLat  = document.getElementById("statLat");

  var sBtn  = document.getElementById("sBtn");
  var sName = document.getElementById("sName");
  var sMenu = document.getElementById("sMenu");
  var sList = document.getElementById("sList");

  var qBtn  = document.getElementById("qBtn");
  var qMode = document.getElementById("qMode");
  var qRes  = document.getElementById("qRes");
  var qMenu = document.getElementById("qMenu");
  var qList = document.getElementById("qList");
  var qFoot = document.getElementById("qFoot");
  var qSrc  = document.getElementById("qSrc");

  var hls = null;
  var retryTimer = null, countdownTimer = null;
  var retryCount = 0, netRecovery = 0, mediaRecovery = 0;
  var measuredBps = 0;   // EWMA of the real encoded bitrate
  var heightIndex = {};  // picture height -> the level index the menu offers

  function noop(){}
  function setTitle(prefix){ document.title = prefix ? (prefix + " · Bloomberg Live") : "Bloomberg Live"; }
  function nativeOk(){ return !!video.canPlayType("application/vnd.apple.mpegurl"); }

  /* ---------- Connection state ---------- */
  function showLoading(text, sub){
    stateEl.hidden = false; stateEl.classList.remove("error");
    stateTxt.textContent = text; stateSub.textContent = sub || "";
    setTitle(retryCount ? "重连中" : "");
  }
  function showError(sub){
    stateEl.hidden = false; stateEl.classList.add("error");
    stateSub.textContent = sub || ""; setTitle("重连中");
  }
  function clearState(){
    stateEl.hidden = true; stateEl.classList.remove("error");
    stateTxt.textContent = ""; stateSub.textContent = ""; setTitle("");
  }
  function showHint(){ hintEl.classList.remove("show"); void hintEl.offsetWidth; hintEl.classList.add("show"); }
  function destroyHls(){ if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } }

  /* Capped exponential backoff beats hammering a CDN every 5s forever. */
  function backoffMs(n){
    var steps = [3000, 5000, 8000, 13000, 21000, 30000];
    return steps[Math.min(n - 1, steps.length - 1)];
  }
  function scheduleRetry(reason, sub){
    retryCount++;
    var wait = backoffMs(retryCount), due = Date.now() + wait;
    var label = reason || "直播连接中断";
    showError(sub);
    clearInterval(countdownTimer);
    function tick(){
      var left = Math.max(0, Math.ceil((due - Date.now()) / 1000));
      stateTxt.textContent = label + " · " + left + " 秒后重试（第 " + retryCount + " 次）";
    }
    tick();
    countdownTimer = setInterval(tick, 250);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(playHls, wait);
  }
  function retryNow(){ clearTimeout(retryTimer); clearInterval(countdownTimer); playHls(); }
  retryBtn.addEventListener("click", retryNow);

  /* ---------- Captions: native bottom rendering ---------- */
  function normalizeCaptions(track){
    var cues = track.cues;
    if(!cues) return;
    for(var i = 0; i < cues.length; i++){
      var c = cues[i];
      if(c.__norm) continue;
      c.__norm = 1;
      try{ c.snapToLines = true; c.line = "auto"; c.position = "auto"; c.align = "center"; }catch(e){}
    }
  }
  function bindCaptionTrack(t){
    if(!t || (t.kind !== "captions" && t.kind !== "subtitles")) return;
    normalizeCaptions(t);
    t.addEventListener("cuechange", function(){ normalizeCaptions(t); });
  }
  if(video.textTracks){
    for(var ti = 0; ti < video.textTracks.length; ti++) bindCaptionTrack(video.textTracks[ti]);
    video.textTracks.addEventListener("addtrack", function(e){ bindCaptionTrack(e.track); });
  }

  /* ---------- Shared popover behaviour ----------
     Both rail controls are listboxes anchored to their own trigger, so the
     open/close and roving-focus logic lives in one place rather than being
     written twice and drifting apart. */
  function closeMenu(btn, pop){
    pop.hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
  function closeAllMenus(){ closeMenu(qBtn, qMenu); closeMenu(sBtn, sMenu); }
  function openMenu(btn, pop, list){
    if(btn.disabled) return;
    closeAllMenus();
    pop.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    var sel = list.querySelector('.q-item[aria-selected="true"]') || list.querySelector(".q-item");
    if(sel) sel.focus();
  }
  function wireMenu(btn, pop, list){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if(pop.hidden) openMenu(btn, pop, list); else closeMenu(btn, pop);
    });
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    pop.addEventListener("keydown", function(e){
      var items = [].slice.call(list.querySelectorAll(".q-item"));
      if(!items.length) return;
      var i = items.indexOf(document.activeElement), k = e.key;
      if(k === "ArrowDown" || k === "ArrowUp"){
        e.preventDefault();
        var n = (i < 0) ? 0 : (i + (k === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items[n].focus();
      } else if(k === "Home"){ e.preventDefault(); items[0].focus(); }
      else if(k === "End"){ e.preventDefault(); items[items.length - 1].focus(); }
      else if(k === "Escape" || k === "Tab"){ e.preventDefault(); closeMenu(btn, pop); btn.focus(); }
    });
  }
  wireMenu(sBtn, sMenu, sList);
  wireMenu(qBtn, qMenu, qList);
  document.addEventListener("click", closeAllMenus);
  function closeQMenu(){ closeMenu(qBtn, qMenu); }

  /* ---------- Source selector ---------- */
  function buildSourceMenu(){
    var html = "";
    SOURCES.forEach(function(s){
      html += '<button class="q-item" type="button" role="option" aria-selected="' +
        (s.id === currentSource.id ? "true" : "false") + '" tabindex="-1" data-src="' + s.id + '">' +
        '<span class="q-bar" aria-hidden="true"></span>' +
        '<span class="q-lbl">' + s.name + '</span>' +
        '<span class="q-rate">' + s.note + '</span>' +
      '</button>';
    });
    sList.innerHTML = html;
    [].slice.call(sList.querySelectorAll(".q-item")).forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        closeMenu(sBtn, sMenu);
        sBtn.focus();
        selectSource(btn.dataset.src);
      });
    });
    sName.textContent = currentSource.name;
  }
  function selectSource(id){
    var s = sourceById(id);
    if(s.id === currentSource.id) return;
    currentSource = s;
    try{ localStorage.setItem("bbg.source", s.id); }catch(e){}
    [].slice.call(sList.querySelectorAll(".q-item")).forEach(function(b){
      b.setAttribute("aria-selected", b.dataset.src === s.id ? "true" : "false");
    });
    sName.textContent = s.name;

    /* Switching is a deliberate restart, not a failure. Clear the backoff
       ladder so it reconnects at once, and drop the native src as well —
       otherwise Safari keeps decoding the previous feed underneath. */
    retryCount = 0; netRecovery = 0; mediaRecovery = 0;
    clearTimeout(retryTimer); clearInterval(countdownTimer);
    destroyHls();
    try{
      video.pause();
      video.removeAttribute("src");
      video.load();
    }catch(e){}
    playHls();
  }
  buildSourceMenu();

  /* ---------- Quality selector, built from real manifest levels ---------- */
  function levelLabel(l){ return l.height ? (l.height + "p") : (Math.round((l.bitrate || 0) / 1000) + "k"); }
  function levelBadge(l){ return l.height >= 1080 ? "FHD" : (l.height >= 720 ? "HD" : ""); }
  function rateLabel(bps){
    if(!bps) return "";
    return bps >= 1000000 ? (Math.round(bps / 100000) / 10 + " Mbps") : (Math.round(bps / 1000) + " kbps");
  }
  function itemHtml(level, label, badge, rate){
    return '<button class="q-item" type="button" role="option" aria-selected="false" tabindex="-1" data-level="' + level + '">' +
      '<span class="q-bar" aria-hidden="true"></span>' +
      '<span class="q-lbl">' + label + '</span>' +
      (badge ? '<span class="q-badge' + (badge === "FHD" ? " is-fhd" : "") + '">' + badge + '</span>' : '') +
      '<span class="q-rate">' + (rate || "") + '</span>' +
    '</button>';
  }
  function resetQuality(){
    closeQMenu();
    qList.innerHTML = "";
    heightIndex = {};
    qBtn.disabled = true;
    qBtn.title = "选择画质";
    qMode.textContent = (prefQuality === "auto") ? "自动" : (prefQuality + "p");
    qSrc.textContent = "自适应";
    qFoot.hidden = true;
  }
  function buildQualityMenu(){
    if(!hls || !hls.levels || !hls.levels.length){ resetQuality(); return; }
    var idxs = hls.levels.map(function(l, i){ return i; }).sort(function(a, b){
      var la = hls.levels[a], lb = hls.levels[b];
      return (lb.height || 0) - (la.height || 0) || (lb.bitrate || 0) - (la.bitrate || 0);
    });
    var seen = {}, html = itemHtml("auto", "自动", "", "");
    heightIndex = {};
    idxs.forEach(function(i){
      var l = hls.levels[i], h = l.height || 0;
      if(seen[h]) return;
      seen[h] = 1;
      heightIndex[h] = i; // the canonical rung for this height
      html += itemHtml(String(i), levelLabel(l), levelBadge(l), rateLabel(l.bitrate));
    });
    qList.innerHTML = html;
    qBtn.disabled = false;
    [].slice.call(qList.querySelectorAll(".q-item")).forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var v = btn.dataset.level;
        if(v === "auto"){
          hls.currentLevel = -1;
          savePref("auto");
        } else {
          var idx = parseInt(v, 10), lv = hls.levels[idx];
          hls.currentLevel = idx;
          savePref(lv && lv.height ? String(lv.height) : "auto");
        }
        measuredBps = 0; // the rung changed; start the average over
        setActiveQuality(v);
        closeQMenu();
        qBtn.focus();
      });
    });
    applyPreferredLevel();
  }
  /* Resolve the remembered height against the ladder this feed actually
     offers: exact match first, then the best rung at or below it, then the
     highest available. "1080p" therefore degrades to "as good as this feed
     gets" instead of silently reverting to auto. */
  function applyPreferredLevel(){
    if(prefQuality === "auto"){
      hls.currentLevel = -1;
      setActiveQuality("auto");
      return;
    }
    var want = parseInt(prefQuality, 10);
    var heights = Object.keys(heightIndex).map(Number).sort(function(a, b){ return b - a; });
    if(!heights.length || !isFinite(want)){
      hls.currentLevel = -1;
      setActiveQuality("auto");
      return;
    }
    var pick = -1, i;
    for(i = 0; i < heights.length; i++){ if(heights[i] === want){ pick = heights[i]; break; } }
    if(pick < 0){ for(i = 0; i < heights.length; i++){ if(heights[i] <= want){ pick = heights[i]; break; } } }
    if(pick < 0) pick = heights[0];

    var idx = heightIndex[pick];
    hls.currentLevel = idx;
    try{ hls.startLevel = idx; }catch(e){}
    measuredBps = 0;
    setActiveQuality(String(idx));
  }
  function setActiveQuality(v){
    [].slice.call(qList.querySelectorAll(".q-item")).forEach(function(b){
      b.setAttribute("aria-selected", b.dataset.level === v ? "true" : "false");
    });
    if(v === "auto"){
      qMode.textContent = "自动";
      qSrc.textContent = "自适应";
      qFoot.hidden = true;
      updateAutoLabel();
    } else {
      var l = hls && hls.levels[parseInt(v, 10)];
      qMode.textContent = l ? levelLabel(l) : "自动";
      qSrc.textContent = "已锁定";
      qFoot.hidden = false;
    }
  }
  /* In auto mode the row shows which level the ABR actually settled on. */
  function updateAutoLabel(){
    var row = qList.querySelector('.q-item[data-level="auto"]');
    if(!row || row.getAttribute("aria-selected") !== "true") return;
    var rate = row.querySelector(".q-rate");
    if(!rate) return;
    rate.textContent = (hls && hls.currentLevel >= 0 && hls.levels[hls.currentLevel])
      ? ("当前 " + levelLabel(hls.levels[hls.currentLevel])) : "";
  }

  /* ---------- Live edge ----------
     hls.latency is the real distance from the live edge. liveSyncPosition is
     only our own playback target, so measuring against it reports drift, not
     latency, and always looks flatteringly small. */
  function targetLatency(){
    var t = hls && hls.targetLatency;
    return (typeof t === "number" && t > 0) ? t : 6;
  }
  function latency(){
    if(hls && typeof hls.latency === "number" && hls.latency > 0) return hls.latency;
    var b = video.buffered;
    if(b && b.length) return Math.max(0, b.end(b.length - 1) - video.currentTime);
    return NaN;
  }
  function liveEdge(){
    if(hls && isFinite(hls.liveSyncPosition)) return hls.liveSyncPosition;
    var b = video.buffered;
    return (b && b.length) ? b.end(b.length - 1) : NaN;
  }
  function jumpToLive(){
    var e = liveEdge();
    if(!isFinite(e)) return;
    try{ video.currentTime = e; }catch(err){}
    video.play().catch(noop);
  }
  liveBtn.addEventListener("click", function(){ if(liveBtn.classList.contains("behind")) jumpToLive(); });

  /* ---------- Playback ---------- */
  function playHls(){
    clearTimeout(retryTimer); clearInterval(countdownTimer);

    if(window.Hls) return startPlayback();

    showLoading(retryCount === 0 ? "正在加载播放组件…" : "正在重新加载播放组件…");
    var wait = window.__hlsReady || function(cb){ cb(false); };
    wait(function(ok){
      if(!ok && !window.Hls && !nativeOk()){
        scheduleRetry("播放组件加载失败", "三个镜像源都没能加载 hls.js。通常是网络受限或被广告拦截插件阻断——换个网络环境或关闭拦截插件后重试。");
        return;
      }
      startPlayback();
    });
  }

  function startPlayback(){
    video.style.display = "block";
    showLoading(retryCount === 0 ? "正在连接 Bloomberg 官方直播…" : "正在重新连接…");
    destroyHls();
    resetQuality();
    measuredBps = 0;
    video.muted = true;
    try{ video.playbackRate = 1; }catch(e){}
    screenEl.classList.add("mutedState");

    if(window.Hls && window.Hls.isSupported()){
      hls = new window.Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 30,

        /* Live sync. maxLiveSyncPlaybackRate lets the player absorb drift by
           running imperceptibly fast, instead of letting it pile up until a
           hard seek is needed — a seek is audible, a 1.05x nudge is not. */
        liveSyncDurationCount: 2,
        liveMaxLatencyDurationCount: 6,
        maxLiveSyncPlaybackRate: 1.3,
        liveDurationInfinity: true,

        /* Startup. The default bandwidth estimate is 0.5 Mbps, which makes the
           very first level pick land near the bottom of the ladder and take
           several fragments to climb. Seed it realistically and skip the
           deliberate probe fragment. */
        abrEwmaDefaultEstimate: 2500000,
        testBandwidth: false,
        startFragPrefetch: true,

        /* Fail fast so the retry ladder can act, rather than hanging. */
        manifestLoadingTimeOut: 8000,
        manifestLoadingMaxRetry: 2,
        manifestLoadingRetryDelay: 500,
        levelLoadingTimeOut: 8000,
        fragLoadingTimeOut: 12000
      });
      hls.loadSource(streamUrl());
      hls.attachMedia(video);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function(){
        retryCount = 0; netRecovery = 0; mediaRecovery = 0;
        clearState();
        /* Runs before the first fragment is requested, so the preferred rung
           is what actually opens — no climbing up from the bottom. */
        buildQualityMenu();
        video.play().catch(noop);
        showHint();
      });
      hls.on(window.Hls.Events.LEVEL_SWITCHED, function(){ measuredBps = 0; updateAutoLabel(); });
      hls.on(window.Hls.Events.FRAG_BUFFERED, function(_e, d){
        netRecovery = 0; mediaRecovery = 0;
        /* Real encoded bitrate: bytes actually delivered for this fragment,
           divided by the media time it covers. Smoothed so it reads steadily. */
        try{
          var st = d && d.stats, dur = d && d.frag && d.frag.duration;
          var bytes = st ? (st.total || st.loaded) : 0;
          if(bytes > 0 && dur > 0){
            var bps = bytes * 8 / dur;
            measuredBps = measuredBps ? (measuredBps * 0.7 + bps * 0.3) : bps;
          }
        }catch(e){}
      });
      hls.on(window.Hls.Events.ERROR, onHlsError);
    } else if(nativeOk()){
      /* Fallback only: the system decoder exposes no level list, so the control
         becomes a readout and latency is whatever the OS player decides. */
      qMode.textContent = "系统解码";
      qBtn.title = "当前由系统直接解码 HLS，不提供可选清晰度列表";
      var mySrc = streamUrl();
      video.src = mySrc;
      video.addEventListener("loadedmetadata", function(){
        if(video.src !== mySrc) return; // a source switch superseded this load
        retryCount = 0; clearState(); video.play().catch(noop); showHint();
      }, {once:true});
      video.addEventListener("error", function(){
        if(video.src !== mySrc) return;
        scheduleRetry("直播连接中断");
      }, {once:true});
    } else {
      showError("该浏览器既不支持 MSE，也不支持原生 HLS 播放。");
      stateTxt.textContent = "当前浏览器无法播放此直播流";
    }
  }

  /* A fatal error is not always terminal: hls.js can reattach the loader or
     flush the buffer in place. Try both twice before tearing everything down. */
  function onHlsError(_evt, data){
    if(!data || !data.fatal) return;
    var T = window.Hls.ErrorTypes;
    if(data.type === T.NETWORK_ERROR && netRecovery < 2){
      netRecovery++;
      showLoading("网络中断，正在恢复…");
      try{ hls.startLoad(); return; }catch(e){}
    }
    if(data.type === T.MEDIA_ERROR && mediaRecovery < 2){
      mediaRecovery++;
      showLoading("解码异常，正在自愈…");
      try{ hls.recoverMediaError(); return; }catch(e){}
    }
    destroyHls();
    scheduleRetry("直播连接中断");
  }

  /* ---------- Audio ---------- */
  try{
    var savedVol = parseFloat(localStorage.getItem("bbg.volume"));
    if(isFinite(savedVol)) video.volume = Math.min(1, Math.max(0, savedVol));
  }catch(e){}
  video.addEventListener("volumechange", function(){
    screenEl.classList.toggle("mutedState", video.muted);
    try{ if(!video.muted) localStorage.setItem("bbg.volume", String(video.volume)); }catch(e){}
  });
  function unmute(){
    if(video.style.display === "none" || !video.muted) return;
    video.muted = false;
    video.play().catch(noop);
    hintEl.classList.remove("show");
  }
  screenEl.addEventListener("click", unmute);

  /* ---------- Fullscreen ---------- */
  function toggleFullscreen(){
    try{
      var fs = document.fullscreenElement || document.webkitFullscreenElement;
      if(fs){
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if(screenEl.requestFullscreen){
        screenEl.requestFullscreen();
      } else if(screenEl.webkitRequestFullscreen){
        screenEl.webkitRequestFullscreen();
      } else if(video.webkitEnterFullscreen){
        video.webkitEnterFullscreen();
      }
    }catch(e){}
  }
  screenEl.addEventListener("dblclick", toggleFullscreen);

  /* ---------- Keyboard ---------- */
  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key || "").toLowerCase();
    if(!qMenu.hidden || !sMenu.hidden){
      if(k === "escape"){ closeAllMenus(); }
      return; // an open menu owns the keyboard
    }
    var tag = document.activeElement ? document.activeElement.tagName : "";
    var onControl = (tag === "BUTTON" || tag === "A" || tag === "INPUT");
    if(k === " " || k === "k"){
      if(onControl && k === " ") return; // let space activate the focused control
      e.preventDefault();
      if(video.paused) video.play().catch(noop); else video.pause();
    } else if(k === "m"){
      if(video.muted) unmute(); else video.muted = true;
    } else if(k === "f"){
      toggleFullscreen();
    } else if(k === "l"){
      jumpToLive();
    } else if(k === "s"){
      e.preventDefault();
      openMenu(sBtn, sMenu, sList);
    }
  });

  /* ---------- Self-healing ---------- */
  document.addEventListener("visibilitychange", function(){
    if(document.hidden) return;
    if(!hls && !retryTimer) return;
    /* Coming back from a background tab, the gap is usually far larger than
       the rate controller can absorb, so seek rather than crawl forward. */
    var l = latency();
    if(isFinite(l) && l > targetLatency() + 10) jumpToLive();
  });
  window.addEventListener("online", function(){ if(!hls) retryNow(); });

  /* ---------- Telemetry rail ---------- */
  setInterval(function(){
    try{
      qRes.textContent = video.videoWidth ? (video.videoWidth + "×" + video.videoHeight) : "—";
      var lvl = (hls && hls.levels && hls.currentLevel >= 0) ? hls.levels[hls.currentLevel] : null;
      // Prefer what is actually arriving; fall back to the manifest's declared
      // value until the first fragment has been measured.
      var shown = measuredBps || (lvl && lvl.bitrate) || 0;
      statRate.textContent = "码率 " + (shown ? (Math.round(shown / 1000).toLocaleString() + " kbps") : "—");

      var lat = latency();
      statLat.textContent = "延迟 " + (isFinite(lat) ? (lat.toFixed(1) + "s") : "—");
      // Tint the readout while the player is quietly catching up.
      statLat.classList.toggle("catching", video.playbackRate > 1.01);

      var behind = isFinite(lat) && lat > targetLatency() + 8 && !video.paused;
      liveBtn.classList.toggle("behind", behind);
      liveTxt.textContent = behind ? "回到直播" : "LIVE";
    }catch(e){}
  }, 1000);

  /* ---------- Clocks ---------- */
  var nyTime = document.getElementById("nyTime");
  var localTime = document.getElementById("localTime");
  var sessionEl = document.getElementById("session");
  var nyFmt, localFmt, partsFmt;
  try{
    nyFmt = new Intl.DateTimeFormat("en-GB", {timeZone:"America/New_York", hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"});
    localFmt = new Intl.DateTimeFormat("en-GB", {hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"});
    partsFmt = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", weekday:"short", hour:"2-digit", minute:"2-digit", hourCycle:"h23"});
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if(tz) document.getElementById("localTz").textContent = tz.split("/").pop().replace(/_/g, " ").toUpperCase();
  }catch(e){}

  /* Session is derived from New York wall-clock time only; market holidays
     are not modelled, so a holiday still reads as an open session. */
  function nySession(){
    var p = partsFmt.formatToParts(new Date()), o = {};
    p.forEach(function(x){ o[x.type] = x.value; });
    var wd = o.weekday;
    var mins = (parseInt(o.hour, 10) % 24) * 60 + parseInt(o.minute, 10);
    if(wd === "Sat" || wd === "Sun") return {t:"周末休市", c:"off"};
    if(mins >= 570 && mins < 960)  return {t:"开市",   c:"on"};
    if(mins >= 240 && mins < 570)  return {t:"盘前",   c:"pre"};
    if(mins >= 960 && mins < 1200) return {t:"盘后",   c:"pre"};
    return {t:"休市", c:"off"};
  }
  function tickClocks(){
    try{
      var now = new Date();
      if(nyFmt) nyTime.textContent = nyFmt.format(now);
      if(localFmt) localTime.textContent = localFmt.format(now);
      if(partsFmt){
        var s = nySession();
        sessionEl.textContent = s.t;
        sessionEl.className = "session " + s.c;
      }
    }catch(e){}
  }
  tickClocks();
  setInterval(tickClocks, 1000);

  /* ---------- Ambient light ----------
     hls.js feeds the element through MSE, so the surface stays same-origin
     and readable. Safari's native HLS path taints it; we fail closed. */
  (function(){
    var reduce = false;
    try{ reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    if(reduce) return;

    var cv = document.createElement("canvas"), ctx = null, ok = true;
    cv.width = 16; cv.height = 9;
    try{ ctx = cv.getContext("2d", {willReadFrequently:true}); }catch(e){ return; }
    if(!ctx) return;

    setInterval(function(){
      if(!ok || document.hidden || video.readyState < 2 || !video.videoWidth) return;
      try{
        ctx.drawImage(video, 0, 0, 16, 9);
        var d = ctx.getImageData(0, 0, 16, 9).data;
        var r = 0, g = 0, b = 0, n = 0;
        for(var i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
        r = r / n; g = g / n; b = b / n;
        // Cap luminance so the glow stays a whisper, never a light show.
        var peak = Math.max(r, g, b) || 1, k = Math.min(1.7, 175 / peak);
        r = Math.round(Math.min(255, r * k));
        g = Math.round(Math.min(255, g * k));
        b = Math.round(Math.min(255, b * k));
        document.documentElement.style.setProperty("--amb", "rgba(" + r + "," + g + "," + b + ",.17)");
      }catch(e){
        ok = false; // tainted canvas or decoder hiccup: stop trying, keep playing
      }
    }, 900);
  })();

  playHls();
})();
</script>
</body>
</html>
