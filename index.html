<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloomberg Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060709; --line:#1c242d;
    --text:#f2f4f7; --muted:#98a2ad; --muted-2:#616a74;
    --accent:#ff6a00; --accent-2:#ff9a4d; --live:#27d17c;
    --radius:16px;
    --hel:'Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1100px 560px at 88% -12%, rgba(255,106,0,.10), transparent 58%),
      radial-gradient(900px 520px at -8% 112%, rgba(38,92,170,.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; overflow:hidden;
    animation:appIn .6s ease both;
  }
  @keyframes appIn{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}
  header{
    position:relative; z-index:10; flex:none;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    padding:18px 30px;
    background:linear-gradient(180deg,rgba(14,19,24,.88),rgba(14,19,24,.55));
    backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
    border-bottom:1px solid var(--line);
  }
  header::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,106,0,.45),transparent);}
  .brand{display:flex; align-items:center;}
  .brand h1{font-family:var(--hel); font-size:25px; font-weight:700; letter-spacing:-.025em; line-height:1; color:#fff;}
  .live-pill{margin-left:auto; display:inline-flex; align-items:center; gap:7px; padding:6px 13px; border-radius:999px;
    background:rgba(39,209,124,.10); border:1px solid rgba(39,209,124,.34); color:#73e6a9;
    font-size:11px; font-weight:700; letter-spacing:.14em;}
  .live-pill .pulse{width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,209,124,.55);}70%{box-shadow:0 0 0 8px rgba(39,209,124,0);}100%{box-shadow:0 0 0 0 rgba(39,209,124,0);}}
  .stage{flex:1 1 auto; min-height:0; display:flex; padding:24px 30px 30px;}
  .screen{position:relative; flex:1 1 auto; min-height:0; min-width:0; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius); overflow:hidden; background:#000; cursor:pointer;
    box-shadow:0 34px 90px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.05);}
  .screen::before{content:""; position:absolute; inset:0; z-index:4; pointer-events:none; border-radius:var(--radius);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.08);}
  .screen video{position:relative; z-index:1; width:100%; height:100%;
    object-fit:contain; background:#000;}
  .screen iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:#000;}
  .screen video::cue{ background:rgba(0,0,0,.7); color:#fff; font-family:'Inter',-apple-system,sans-serif; font-size:0.72em; line-height:1.35; text-shadow:0 1px 2px rgba(0,0,0,.6); }

  /* Quality selector */
  .quality{position:absolute; top:14px; right:14px; z-index:6; opacity:0; transform:translateY(-4px);
    transition:opacity .25s ease, transform .25s ease; pointer-events:none;}
  .screen:hover .quality, .quality.open{opacity:1; transform:none; pointer-events:auto;}
  .q-btn{display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border-radius:10px;
    background:rgba(8,11,14,.6); backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%);
    border:1px solid rgba(255,255,255,.14); color:#f2f4f7; font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.01em; cursor:pointer; transition:border-color .2s, background .2s;}
  .q-btn:hover{background:rgba(8,11,14,.8); border-color:rgba(255,255,255,.28);}
  .q-btn svg{width:14px; height:14px;}
  .q-menu{position:absolute; top:calc(100% + 6px); right:0; min-width:140px; padding:6px; border-radius:12px;
    background:rgba(8,11,14,.84); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid rgba(255,255,255,.12); box-shadow:0 18px 44px rgba(0,0,0,.55); display:flex; flex-direction:column; gap:2px;}
  .q-item{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:8px; background:transparent; border:0;
    color:#cfd6dd; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:500; cursor:pointer; text-align:left; width:100%;
    transition:background .15s, color .15s;}
  .q-item:hover{background:rgba(255,255,255,.07); color:#fff;}
  .q-item.active{color:#fff;}
  .q-item .tick{width:13px; height:13px; flex:none; opacity:0;}
  .q-item.active .tick{opacity:1;}
  .q-item .lbl{flex:1;}
  .q-item .hd{font-size:9px; font-weight:700; letter-spacing:.05em; padding:1px 5px; border-radius:4px;
    background:rgba(255,106,0,.16); color:var(--accent-2);}

  .status{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:14px;
    font-weight:500; letter-spacing:.02em; text-align:center; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:14px;}
  .status:not(:empty)::before{content:""; width:28px; height:28px; border-radius:50%;
    border:2.5px solid rgba(255,255,255,.14); border-top-color:var(--accent); animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:5; display:none; align-items:center; gap:8px;
    padding:9px 16px; border-radius:999px; background:rgba(6,8,10,.62); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.11); color:var(--text); font-size:12.5px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .hint.show{display:flex; animation:hintFade 5.5s ease forwards;}
  .hint svg{width:15px; height:15px; fill:var(--accent);}
  @keyframes hintFade{0%{opacity:0; transform:translateX(-50%) translateY(8px);}12%,72%{opacity:1; transform:translateX(-50%) translateY(0);}100%{opacity:0; transform:translateX(-50%) translateY(8px); visibility:hidden;}}

  /* Glass control buttons (overlay, bottom-left) */
  .controls{position:absolute; left:14px; bottom:14px; z-index:6; display:flex; gap:8px;
    opacity:0; transform:translateY(4px); transition:opacity .25s ease, transform .25s ease; pointer-events:none;}
  .screen:hover .controls{opacity:1; transform:none; pointer-events:auto;}
  .ctl-btn{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:12px;
    background:rgba(8,11,14,.6); backdrop-filter:blur(14px) saturate(150%); -webkit-backdrop-filter:blur(14px) saturate(150%);
    border:1px solid rgba(255,255,255,.14); color:#f2f4f7; cursor:pointer;
    transition:border-color .2s, background .2s, transform .15s;}
  .ctl-btn:hover{background:rgba(8,11,14,.82); border-color:rgba(255,255,255,.30); transform:translateY(-1px);}
  .ctl-btn:active{transform:translateY(0);}
  .ctl-btn svg{width:18px; height:18px;}

  /* In-page picture-in-picture: floating glass rounded window */
  .screen.pip{position:fixed; left:auto; top:auto; right:24px; bottom:24px;
    width:384px; max-width:48vw; height:auto; aspect-ratio:16/9; flex:none; z-index:1000; cursor:default;
    border-radius:18px;
    box-shadow:0 28px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08);
    animation:pipIn .32s cubic-bezier(.2,.8,.2,1) both;}
  .screen.pip::before{border-radius:18px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.12);}
  .screen.pip .quality{display:none;}
  @keyframes pipIn{from{opacity:0; transform:translateY(14px) scale(.95);}to{opacity:1; transform:none;}}
  .pip-bar{display:none;}
  .screen.pip .pip-bar{position:absolute; top:0; left:0; right:0; z-index:8; display:flex; align-items:center; gap:9px;
    padding:8px 10px; cursor:move; border-radius:18px 18px 0 0;
    background:linear-gradient(180deg,rgba(8,11,14,.80),rgba(8,11,14,.10));
    backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
    border-bottom:1px solid rgba(255,255,255,.08);
    opacity:0; transition:opacity .2s ease;}
  .screen.pip:hover .pip-bar{opacity:1;}
  .pip-title{display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; letter-spacing:.1em; color:#dfe5ea;}
  .pip-dot{width:7px; height:7px; border-radius:50%; background:var(--live); animation:pulse 1.8s infinite;}
  .pip-actions{margin-left:auto; display:flex; gap:6px;}
  .pip-btn{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:8px;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); color:#e6eaef; cursor:pointer;
    transition:background .18s, border-color .18s;}
  .pip-btn:hover{background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.28);}
  .pip-btn svg{width:14px; height:14px;}

  /* Empty stage note while in picture-in-picture */
  .stage-empty{display:none; flex:1 1 auto; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    border-radius:var(--radius); border:1px dashed rgba(255,255,255,.10); background:rgba(255,255,255,.015);
    color:var(--muted); font-size:14px; font-weight:500;}
  body.pip-active .stage-empty{display:flex;}
  .stage-empty button{padding:9px 18px; border-radius:10px; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14); color:#f2f4f7; font-family:'Inter',sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; transition:background .18s,border-color .18s;}
  .stage-empty button:hover{background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.28);}

  @media(max-width:680px){
    header{padding:14px 16px; gap:12px;} .stage{padding:14px 16px 18px;}
    .brand h1{font-size:22px;}
    .screen.pip{width:auto; left:12px; right:12px; bottom:12px; max-width:none;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><h1>Bloomberg</h1></div>
    <span class="live-pill"><span class="pulse"></span>LIVE</span>
  </header>
  <div class="stage">
    <div class="screen" id="screen">
      <div class="status" id="status"></div>
      <div class="controls" id="controls">
        <button class="ctl-btn" id="playBtn" type="button" title="暂停">
          <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"></rect></svg>
        </button>
        <button class="ctl-btn" id="muteBtn" type="button" title="点击取消静音">
          <svg id="muteIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>
        <button class="ctl-btn" id="pipBtn" type="button" title="画中画">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8"></path><path d="M3 12v6a2 2 0 0 0 2 2h6"></path><rect x="12" y="13" width="9" height="7" rx="1.5" fill="currentColor" stroke="none"></rect></svg>
        </button>
        <button class="ctl-btn" id="fsBtn" type="button" title="全屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
        </button>
      </div>
      <div class="pip-bar" id="pipBar">
        <span class="pip-title"><span class="pip-dot"></span>BLOOMBERG · LIVE</span>
        <div class="pip-actions">
          <button class="pip-btn" id="pipExit" type="button" title="退出画中画">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
          </button>
        </div>
      </div>
      <div class="quality" id="quality" hidden>
        <button class="q-btn" id="qBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span id="qLabel">Auto</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:11px;height:11px;opacity:.6"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="q-menu" id="qMenu" hidden></div>
      </div>
      <div class="hint" id="hint"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg><span>点击画面可取消静音</span></div>
      <video id="video" playsinline style="display:none"></video>
      <iframe id="frame" src="" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="display:none"></iframe>
    </div>
    <div class="stage-empty" id="stageEmpty">
      <span>画中画播放中 — 视频正在右下角悬浮窗播放</span>
      <button type="button" id="stageReturn">返回主画面</button>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
  var HLS_URL = "https://www.bloomberg.com/media-manifest/streams/us.m3u8";
  var YT_CHANNEL = "UCIALMKvObZNtJ6AmdCLP7Lg";

  var video = document.getElementById("video");
  var frame = document.getElementById("frame");
  var statusEl = document.getElementById("status");
  var hintEl = document.getElementById("hint");
  var screenEl = document.getElementById("screen");
  var controlsEl = document.getElementById("controls");
  var qWrap = document.getElementById("quality");
  var qBtn = document.getElementById("qBtn");
  var qLabel = document.getElementById("qLabel");
  var qMenu = document.getElementById("qMenu");
  var hls = null;

  function setStatus(t){ statusEl.textContent = t || ""; }
  function showHint(){ hintEl.classList.remove("show"); void hintEl.offsetWidth; hintEl.classList.add("show"); }
  function destroyHls(){ if(hls){ hls.destroy(); hls=null; } }
  function showVideo(){ video.style.display="block"; frame.style.display="none"; frame.src=""; if(controlsEl) controlsEl.style.display="flex"; }
  function showFrame(){ frame.style.display="block"; video.style.display="none"; destroyHls(); video.removeAttribute("src"); hintEl.classList.remove("show"); qWrap.hidden=true; if(controlsEl) controlsEl.style.display="none"; if(screenEl.classList.contains("pip")) setPip(false); }

  // ---- Captions: pure native bottom rendering (identical to the original project) ----
  function normalizeCaptions(track){
    var cues = track.cues;
    if(!cues) return;
    for(var i=0;i<cues.length;i++){
      var c=cues[i];
      if(c.__norm) continue;
      c.__norm = 1;
      try{ c.snapToLines = true; c.line = "auto"; c.position = "auto"; c.align = "center"; }catch(e){}
    }
  }
  function bindCaptionTrack(t){
    if(!t || (t.kind!=="captions" && t.kind!=="subtitles")) return;
    normalizeCaptions(t);
    t.addEventListener("cuechange", function(){ normalizeCaptions(t); });
  }
  if(video.textTracks){
    for(var ti=0; ti<video.textTracks.length; ti++) bindCaptionTrack(video.textTracks[ti]);
    video.textTracks.addEventListener("addtrack", function(e){ bindCaptionTrack(e.track); });
  }

  // ---- Quality selector (built from real manifest levels) ----
  function levelLabel(l){ return l.height ? (l.height + "p") : (Math.round((l.bitrate||0)/1000) + "k"); }
  function levelBadge(l){ return l.height>=1080 ? "FHD" : (l.height>=720 ? "HD" : ""); }
  function tickSvg(){ return '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#ff9a4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'; }
  function itemHtml(level,label,badge){
    return '<button class="q-item" type="button" data-level="'+level+'">'+tickSvg()+'<span class="lbl">'+label+'</span>'+(badge?'<span class="hd">'+badge+'</span>':'')+'</button>';
  }
  function buildQualityMenu(){
    if(!hls || !hls.levels || !hls.levels.length){ qWrap.hidden=true; return; }
    var idxs = hls.levels.map(function(l,i){return i;}).sort(function(a,b){
      var la=hls.levels[a], lb=hls.levels[b];
      return (lb.height||0)-(la.height||0) || (lb.bitrate||0)-(la.bitrate||0);
    });
    var seen={}, html = itemHtml("auto","Auto","");
    idxs.forEach(function(i){ var l=hls.levels[i], h=l.height||0; if(seen[h]) return; seen[h]=1; html += itemHtml(String(i), levelLabel(l), levelBadge(l)); });
    qMenu.innerHTML = html;
    qWrap.hidden = false;
    qMenu.querySelectorAll(".q-item").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var v=btn.dataset.level;
        hls.currentLevel = (v==="auto") ? -1 : parseInt(v,10);
        setActiveQuality(v); closeQMenu();
      });
    });
    setActiveQuality("auto");
  }
  function setActiveQuality(v){
    qMenu.querySelectorAll(".q-item").forEach(function(b){ b.classList.toggle("active", b.dataset.level===v); });
    if(v==="auto"){ updateAutoLabel(); }
    else { var l=hls.levels[parseInt(v,10)]; if(l) qLabel.textContent = levelLabel(l); }
  }
  function updateAutoLabel(){
    var active = qMenu.querySelector(".q-item.active");
    if(!active || active.dataset.level!=="auto") return;
    var suffix = (hls && hls.currentLevel>=0 && hls.levels[hls.currentLevel]) ? (" \u00b7 " + levelLabel(hls.levels[hls.currentLevel])) : "";
    qLabel.textContent = "Auto" + suffix;
  }
  function closeQMenu(){ qMenu.hidden=true; qWrap.classList.remove("open"); }
  qBtn.addEventListener("click", function(e){ e.stopPropagation(); var willOpen=qMenu.hidden; qMenu.hidden=!willOpen; qWrap.classList.toggle("open", willOpen); });
  qMenu.addEventListener("click", function(e){ e.stopPropagation(); });
  document.addEventListener("click", function(){ closeQMenu(); });

  // ---- Play / Pause (glass) ----
  var playBtn = document.getElementById("playBtn");
  var playIcon = document.getElementById("playIcon");
  var SVG_PLAY = '<polygon points="6 4 20 12 6 20 6 4" fill="currentColor" stroke="none"></polygon>';
  var SVG_PAUSE = '<rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"></rect><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"></rect>';
  function updatePlayIcon(){ if(!playIcon) return; playIcon.innerHTML = video.paused ? SVG_PLAY : SVG_PAUSE; if(playBtn) playBtn.title = video.paused ? "播放" : "暂停"; }
  if(playBtn){ playBtn.addEventListener("click", function(e){ e.stopPropagation(); if(video.paused){ video.play().catch(function(){}); } else { video.pause(); } }); }
  video.addEventListener("play", updatePlayIcon);
  video.addEventListener("pause", updatePlayIcon);
  updatePlayIcon();

  // ---- Mute toggle (glass) ----
  var muteBtn = document.getElementById("muteBtn");
  var muteIcon = document.getElementById("muteIcon");
  var SVG_MUTED = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
  var SVG_SOUND = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.8 5.5a9 9 0 0 1 0 13"></path>';
  function updateMuteIcon(){ if(!muteIcon) return; muteIcon.innerHTML = video.muted ? SVG_MUTED : SVG_SOUND; if(muteBtn) muteBtn.title = video.muted ? "点击取消静音" : "点击静音"; }
  function setMuted(m){ video.muted = m; if(!m){ video.play().catch(function(){}); hintEl.classList.remove("show"); } }
  if(muteBtn){ muteBtn.addEventListener("click", function(e){ e.stopPropagation(); setMuted(!video.muted); }); }
  video.addEventListener("volumechange", updateMuteIcon);
  updateMuteIcon();

  // ---- Fullscreen (glass) ----
  var fsBtn = document.getElementById("fsBtn");
  if(fsBtn){ fsBtn.addEventListener("click", function(e){ e.stopPropagation();
    if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); }
    else if(screenEl.requestFullscreen){ screenEl.requestFullscreen().catch(function(){}); }
  }); }

  // ---- In-page picture-in-picture (glass, rounded floating window) ----
  var pipBtn = document.getElementById("pipBtn");
  var pipExit = document.getElementById("pipExit");
  var pipBar = document.getElementById("pipBar");
  var stageReturn = document.getElementById("stageReturn");
  function setPip(on){
    if(on && video.style.display==="none") return;
    screenEl.classList.toggle("pip", on);
    document.body.classList.toggle("pip-active", on);
    if(!on){ screenEl.style.left=""; screenEl.style.top=""; screenEl.style.right=""; screenEl.style.bottom=""; }
  }
  if(pipBtn){ pipBtn.addEventListener("click", function(e){ e.stopPropagation(); setPip(!screenEl.classList.contains("pip")); }); }
  if(pipExit){ pipExit.addEventListener("click", function(e){ e.stopPropagation(); setPip(false); }); }
  if(stageReturn){ stageReturn.addEventListener("click", function(e){ e.stopPropagation(); setPip(false); }); }
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && screenEl.classList.contains("pip")) setPip(false); });
  (function(){
    if(!pipBar) return;
    var dragging=false, sx=0, sy=0, ox=0, oy=0;
    pipBar.addEventListener("pointerdown", function(e){
      if(!screenEl.classList.contains("pip")) return;
      dragging=true; var r=screenEl.getBoundingClientRect();
      ox=r.left; oy=r.top; sx=e.clientX; sy=e.clientY;
      screenEl.style.right="auto"; screenEl.style.bottom="auto";
      screenEl.style.left=ox+"px"; screenEl.style.top=oy+"px";
      try{ pipBar.setPointerCapture(e.pointerId); }catch(_){}
    });
    pipBar.addEventListener("pointermove", function(e){
      if(!dragging) return;
      var r=screenEl.getBoundingClientRect();
      var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
      nx=Math.max(8, Math.min(window.innerWidth-r.width-8, nx));
      ny=Math.max(8, Math.min(window.innerHeight-r.height-8, ny));
      screenEl.style.left=nx+"px"; screenEl.style.top=ny+"px";
    });
    pipBar.addEventListener("pointerup", function(e){ dragging=false; try{ pipBar.releasePointerCapture(e.pointerId); }catch(_){}});
  })();

  function playYouTube(){
    showFrame(); setStatus("");
    frame.src="https://www.youtube.com/embed/live_stream?channel="+YT_CHANNEL+"&autoplay=1&mute=1";
  }

  function playHls(){
    showVideo(); setStatus("正在连接 Bloomberg 官方直播…");
    destroyHls(); video.muted=true; updateMuteIcon();
    var fellBack=false;
    function fallback(){ if(fellBack) return; fellBack=true; playYouTube(); }
    if(window.Hls && window.Hls.isSupported()){
      hls=new window.Hls({ enableWorker:true, lowLatencyMode:true,
        liveSyncDurationCount:2, liveMaxLatencyDurationCount:6 });
      hls.loadSource(HLS_URL); hls.attachMedia(video);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function(){
        setStatus(""); buildQualityMenu();
        video.play().catch(function(){}); showHint();
      });
      hls.on(window.Hls.Events.LEVEL_SWITCHED, function(){ updateAutoLabel(); });
      hls.on(window.Hls.Events.ERROR, function(_e,data){ if(data && data.fatal){ destroyHls(); fallback(); } });
    } else if(video.canPlayType("application/vnd.apple.mpegurl")){
      qWrap.hidden=true;
      video.src=HLS_URL;
      video.addEventListener("loadedmetadata", function(){ setStatus(""); video.play().catch(function(){}); showHint(); }, {once:true});
      video.addEventListener("error", function(){ fallback(); }, {once:true});
    } else { fallback(); }
  }

  screenEl.addEventListener("click", function(e){
    if(e.target.closest(".controls") || e.target.closest(".pip-bar") || e.target.closest(".quality")) return;
    if(video.style.display!=="none" && video.muted){ video.muted=false; video.play().catch(function(){}); hintEl.classList.remove("show"); }
  });

  playHls();
</script>
</body>
</html>
