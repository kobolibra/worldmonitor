name: Android APK

# Deliberately narrow: this can only be woken by a push to the `apps`
# branch that touches the app itself, or by a manual dispatch. Edits to
# gh-pages (the actual website) will never trigger a build.
on:
  push:
    branches: [apps]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the build platform
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # An app's identity is its signing certificate, and that certificate has
      # to stay the same for the lifetime of the package or upgrades stop
      # installing. So the key is minted exactly once, on the first build that
      # finds none, and committed back to this branch; every later build reuses
      # it untouched.
      #
      # It is stored in the open, which is a deliberate trade. The alternative -
      # a secret - would mean a human generating a keystore, base64ing it and
      # pasting four values into repository settings, and would have to be
      # repeated on every fork or restore. This app ships no credentials, talks
      # to one public page, and is never listed in a store, so the only thing
      # the key protects is the ability to publish an upgrade to a package that
      # is only ever installed by hand. Convenience wins. If this app ever
      # gains an account or goes to a store, move the keystore into
      # BBG_KEYSTORE_BASE64 and delete the committed copy.
      #
      # A push made with GITHUB_TOKEN does not start another workflow run, so
      # committing the key here cannot loop.
      - name: Make sure a signing key exists
        env:
          KEY_B64: android/signing/bbg-release.jks.base64
        run: |
          set -euo pipefail
          if [ ! -f "$KEY_B64" ]; then
            echo "No signing key in the repository yet - creating one."
            mkdir -p "$(dirname "$KEY_B64")"
            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/bbg.jks" \
              -alias bbglive \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass bbglive -keypass bbglive \
              -dname "CN=Bloomberg Live, OU=Personal, O=kobolibra, C=CN"
            base64 -w0 "$RUNNER_TEMP/bbg.jks" > "$KEY_B64"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEY_B64"
            git commit -m "ci: create the app signing key, once, so every build carries the same certificate"
            git push origin HEAD:apps
          fi
          base64 -d "$KEY_B64" > "$RUNNER_TEMP/bbg.jks"
          test -s "$RUNNER_TEMP/bbg.jks"

      - name: Assemble the signed release
        working-directory: android
        env:
          BBG_KEYSTORE_FILE: ${{ runner.temp }}/bbg.jks
          BBG_KEYSTORE_PASSWORD: bbglive
          BBG_KEY_ALIAS: bbglive
          BBG_KEY_PASSWORD: bbglive
          BBG_VERSION_CODE: ${{ github.run_number }}
          BBG_VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the artifact something a human can recognise
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bloomberg-live.apk
          ls -lh bloomberg-live.apk

      # Prints the certificate now pinned to this package for the rest of its
      # life. Worth having in the log: if it ever changes, upgrades on the
      # device will start failing and this is where the answer is.
      - name: Show the certificate
        run: "$ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs --verbose bloomberg-live.apk"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bloomberg-live-apk
          path: bloomberg-live.apk
          if-no-files-found: error

      - name: Publish a release so the phone can download it directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Bloomberg Live APK (build ${{ github.run_number }})
          body: |
            A WebView shell around https://kobolibra.github.io/worldmonitor/

            Properly signed release build, not a debug build, so Play Protect
            has far less to complain about.

            The first signed build has to be installed after uninstalling the
            old debug copy - the certificates differ and Android will not
            replace one with the other. Every build after that installs
            straight over the top.

            Download `bloomberg-live.apk` below and open it on the device.
            Installation from unknown sources still has to be allowed once.

            The app loads the live page, so any later fix to the page reaches
            this build automatically - no reinstall needed.
          files: bloomberg-live.apk
          draft: false
          prerelease: false
